# fiducial.toml — the platform, as a product.
#
# Fiducial is not a scaffolded product and does not become one by having this
# file. What this buys is level 2 of the self-hosting boundary
# (docs/specs/2026-09-14-self-hosting-boundary.md): `fid dash` and `fid doctor`
# read a repository, they do not produce what builds it, so there is no
# bootstrap problem and the cost is this file.
#
# Before it existed, every signal `fid dash` was built to give was unavailable
# in the repository that built it.
#
# Deliberately NOT adopted: `fid derive` over this repo's generated artifacts.
# The protocol vectors and the terminal captures are gated by Rust tests on
# purpose — those gates must fire even when `fid` is broken, and a gate that
# runs through the tool it gates is blind exactly where it matters.

[product]
name    = "fiducial"
version = "0.1.0"

[spine]
# The L0 crates are built here rather than consumed.
enabled = false

[capabilities]
# Capabilities are authored here, not installed here.
enabled = []

[freshness]
# How a stale artifact is stopped here, given the paragraph above.
#
# `fid dash` recognises `fid derive --check` on its own — that is what a
# scaffolded product uses. This block names the gates a repository uses
# *instead*, and exists because dash reported this repository as ungated while
# every one of these ran on every commit. The reason it could not know is that
# "which command gates an artifact" is a judgment, and a judgment has to be
# declared rather than pattern-matched.
#
# A gate listed here that no workflow runs is reported too: a declared gate
# reads as protection whether or not anything runs it.
gates = [
    # The wire format, and the decision table both languages replay.
    "cargo test -p fiducial-protocol --test vectors",
    "cargo test -p fiducial-identity",
    # Terminal output in the guides, and the derived blocks in this repo's
    # own agent context.
    "cargo test -p fiducial-cli --test captures",
    "context --check",
    # Generated TypeScript: the wasm bridge, and the adapter factory a product
    # gets from `fid derive`.
    "git diff --exit-code packages/wasm-bridge/src/generated.ts",
    "test:generated",
    # The generated grants schema, on the two engines it claims to support.
    "test:schema",
    "scripts/verify-postgres.sh",
    # The compatibility matrix against the compiled wire version.
    "fid release check",
]

[guard]
# The rules products get are the rules we work under.
rules = [
    "no-direct-main-push",
    "no-unpinned-cli-fetch",
]
