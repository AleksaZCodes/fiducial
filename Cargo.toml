[workspace]
resolver = "2"
members = [
    "crates/fiducial",
    "crates/fiducial-adapters",
    "crates/fiducial-core",
    "crates/fiducial-quantity",
    "crates/fiducial-model",
    "crates/fiducial-protocol",
    "crates/fiducial-eda",
    "crates/fiducial-geometry",
    "crates/fiducial-identity",
    "crates/fiducial-mesh",
    "crates/fiducial-ota",
    "crates/fiducial-sim",
    "crates/fiducial-tauri",
    "crates/fiducial-wasm",
    "crates/fiducial-cli",
]
exclude = ["firmware/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT"
repository   = "https://github.com/AleksaZCodes/fiducial"
homepage     = "https://github.com/AleksaZCodes/fiducial"
authors      = ["Aleksa Zdravkovic"]
rust-version = "1.82"

# ── Dependency declarations ─────────────────────────────────────────────────
# Principle 1: a version used by two crates is declared once, here, and
# inherited with `dep.workspace = true`. Before this table `serde` carried five
# independent version declarations and `sha2` three — the same drift this
# platform exists to delete, in the repository that states the rule.
#
# Features are NOT declared here. A version is one fact shared by every
# consumer; a feature set is a per-crate decision (`fiducial-ota` needs
# `postcard` without `std`, its dev-dependencies need it with). So each crate
# still writes `features = [...]`, and only the version is inherited.
[workspace.dependencies]
# Serialization — the wire and schema contracts.
serde      = { version = "1", default-features = false }
serde_json = { version = "1" }
postcard   = { version = "1", default-features = false }
toml       = { version = "0.8" }

# Cryptography — OTA manifest signing and image digests.
sha2          = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false }

# Math — `no_std` float functions for the geometry and mesh crates.
libm = { version = "0.2" }

# Host-only tooling.
anyhow     = { version = "1" }
clap       = { version = "4" }
thiserror  = { version = "2" }
walkdir    = { version = "2" }
tempfile   = { version = "3" }
tokio      = { version = "1" }
rayon      = { version = "1" }
serialport = { version = "4", default-features = false }
diffy      = { version = "0.4" }
hex        = { version = "0.4" }
chrono     = { version = "0.4", default-features = false }

# WASM bindings and TypeScript type generation.
wasm-bindgen      = { version = "0.2" }
wasm-bindgen-test = { version = "0.3" }
ts-rs             = { version = "10" }

# ── Internal crates ─────────────────────────────────────────────────────────
# Path declared once so moving a crate is a one-line change, not thirteen.
#
# `version` is required, and it is the one duplication cargo leaves no way to
# avoid: `cargo publish` rejects any dependency without a version requirement
# ("all dependencies must have a version requirement specified when
# publishing"), and `version.workspace = true` is not accepted inside
# `[workspace.dependencies]`. Every dependent crate was unpublishable without
# these — which is one of the reasons nothing has ever reached crates.io.
#
# It is a duplicate of `[workspace.package] version` that cannot be deleted —
# but it needs no gate of its own, because **cargo already enforces it more
# strictly than a test could.** The resolver compares this requirement against
# the sibling's actual version, so a line here that disagrees fails every
# build immediately:
#
#     error: failed to select a version for the requirement
#     `fiducial-geometry = "^0.9.9"` … candidate versions found which didn't
#     match: 0.1.0
#
# A test asserting the same thing was written here and deleted: a second gate
# behind a stronger one is noise that still has to be maintained.
fiducial-adapters = { path = "crates/fiducial-adapters", version = "0.1.0" }
fiducial-core     = { path = "crates/fiducial-core", version = "0.1.0" }
fiducial-quantity = { path = "crates/fiducial-quantity", version = "0.1.0" }
fiducial-model    = { path = "crates/fiducial-model", version = "0.1.0" }
fiducial-protocol = { path = "crates/fiducial-protocol", version = "0.1.0" }
fiducial-eda      = { path = "crates/fiducial-eda", version = "0.1.0" }
fiducial-geometry = { path = "crates/fiducial-geometry", version = "0.1.0" }
fiducial-mesh     = { path = "crates/fiducial-mesh", version = "0.1.0" }
fiducial-ota      = { path = "crates/fiducial-ota", version = "0.1.0" }
fiducial-sim      = { path = "crates/fiducial-sim", version = "0.1.0" }
fiducial-tauri    = { path = "crates/fiducial-tauri", version = "0.1.0" }
