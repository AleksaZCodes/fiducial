# Firmware Cargo workspace — intentionally SEPARATE from the host workspace.
#
# Why separate? One Cargo workspace shares one Cargo.lock and one
# .cargo/config.toml target. A root `cargo test` would try to build firmware
# for the host and fail. Each firmware workspace has its own lockfile, toolchain
# file, target triple, and probe-rs runner. The host workspace excludes this
# directory: `exclude = ["firmware/*"]` in the root Cargo.toml.
#
# Design spec §5: "Firmware workspaces are separate on purpose."

[workspace]
resolver = "2"
members  = [
    "shared",
    "rp2040",
    "stm32",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/AleksaZCodes/fiducial"
authors    = ["Aleksa Zdravkovic"]

# ── Shared workspace dependencies ────────────────────────────────────────────
[workspace.dependencies]
# fiducial-core is the spine — the same crate the browser and desktop use,
# compiled for the target triple instead of x86_64.
fiducial-core = { path = "../crates/fiducial-core" }

# Embassy async executor and target HALs
embassy-executor = { version = "0.10", default-features = false }
embassy-rp       = { version = "0.10", default-features = false }
embassy-stm32    = { version = "0.6", default-features = false }
embassy-time     = { version = "0.5",  default-features = false }

# defmt — deferred formatting for embedded: minimal flash cost
defmt            = "0.3"
defmt-rtt        = "0.4"
panic-probe      = { version = "0.3", features = ["print-defmt"] }

# Cortex-M runtime
cortex-m         = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt      = "0.7"

# ── Workspace-level profiles ──────────────────────────────────────────────────
# Declared here so per-crate [profile.*] tables are not needed (Cargo warns
# when profiles appear in non-root workspace members).
[profile.dev]
debug           = 2
opt-level       = "s"
overflow-checks = true

[profile.release]
debug           = 2
opt-level       = "s"
lto             = true
codegen-units   = 1
overflow-checks = false
