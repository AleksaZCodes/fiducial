# Fiducial protocol compatibility matrix
#
# Maintained by `fid release protocol --bump` — do not edit by hand.
# `fid release check` verifies wire.current matches WIRE_VERSION in
# crates/fiducial-protocol/src/lib.rs.

[wire]
current = 2
min_compatible = 2

[[history]]
version = 1
date = "2026-09-10"
notes = """
Initial wire protocol.
Frame layout: MAGIC(0xFD, 1B) | LEN_LO(1B) | LEN_HI(1B) | PAYLOAD(N) | CRC8(1B).
CRC-8 is an XOR fold over all payload bytes.
Maximum payload: 65 535 bytes.
"""

[[history]]
version = 2
date = "2026-09-10"
notes = "CRC-8 XOR fold replaced with CRC-32/ISO-HDLC. Frame overhead 4 -> 7 bytes. An 8-bit check over a 64 KB payload is inadequate; v1 artifacts cannot parse v2 frames."
