description = "SvelteKit web app with Turborepo wiring, Biome, and Changesets"
guard_rules = ["no-unpinned-cli-fetch"]

# Vendor skills (https://github.com/cloudflare/skills), installed by the `skills`
# CLI like any other skill. An agent loads one before editing a Wrangler config.
[[agent_skills]]
id     = "cloudflare-workers"
source = "cloudflare/skills"
skills = ["wrangler", "workers-best-practices"]
paths  = ["**/wrangler.jsonc", "**/wrangler.json", "**/wrangler.toml"]
why    = "Wrangler configuration and the Workers runtime change between releases; Cloudflare's skills carry the current ones, and what you remember may not be."

[[agent_skills]]
id     = "cloudflare-frameworks"
source = "cloudflare/skills"
skills = ["frameworks-on-cloudflare"]
paths  = ["**/vite.config.*", "**/astro.config.*", "**/svelte.config.*", "**/react-router.config.*"]
why    = "How Astro, SvelteKit, React Router and TanStack Start build for Workers is set by their Cloudflare integration, which changes; this skill is Cloudflare's current guidance."
