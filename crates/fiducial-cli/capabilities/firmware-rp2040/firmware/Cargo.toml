# Firmware Cargo workspace for {{name}}.
# Intentionally separate from the host workspace — different target triple + toolchain.
# Design spec §5: "Firmware workspaces are separate on purpose."

[workspace]
resolver = "2"
members  = [
    "shared",
    "rp2040",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
fiducial-core     = "{{version}}"
fiducial-protocol = "{{version}}"

embassy-executor = { version = "0.10", default-features = false }
embassy-rp       = { version = "0.10", default-features = false }
embassy-time     = { version = "0.5",  default-features = false }

defmt       = "0.3"
defmt-rtt   = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"

# Profiles apply only at the workspace root; in a member they are ignored.
[profile.dev]
debug           = 2
opt-level       = "s"
overflow-checks = true

[profile.release]
debug           = 2
opt-level       = "s"
lto             = true
codegen-units   = 1
overflow-checks = false
