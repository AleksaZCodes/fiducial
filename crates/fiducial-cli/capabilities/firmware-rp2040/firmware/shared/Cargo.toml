[package]
name        = "firmware-shared"
description = "Target-agnostic firmware helpers for {{name}}."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
lora = ["dep:lora-modulation"]

[dependencies]
fiducial-core     = { workspace = true }
fiducial-protocol = { workspace = true }
lora-modulation   = { version = "0.1", optional = true, default-features = false }
