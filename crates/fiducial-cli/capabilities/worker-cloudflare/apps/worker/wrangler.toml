name            = "{{name}}-worker"
main            = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Non-secret environment variables. Secrets go through `wrangler secret put`.
FIDUCIAL_VERSION = "{{version}}"

# ── Bindings ────────────────────────────────────────────────────────────────
#
# Do not hand-write them. Run `fid add deploy` and this file becomes a
# derivation of `[adapters]` + `[deploy]` in fiducial.toml: selecting
# `database = "d1"` is what puts a `[[d1_databases]]` block here, under the
# binding name the adapter actually reads.
#
# This comment used to carry examples binding `MY_DB` and `MY_BUCKET`, while
# every adapter reads `DB` and `BUCKET` — so a product that followed the
# example got a Worker that threw on its first query. That is why bindings
# are derived now rather than copied: the fact lived in two places, and the
# copy was wrong.
#
#   fid add deploy
#   # set [adapters] deploy = "cloudflare", fill the ids in [deploy]
#   fid derive
