description = "Next.js web app with Turborepo wiring, Biome, and Changesets"
guard_rules = ["no-unpinned-cli-fetch"]

# The app's stylesheet is written against the design system. `globals.css`
# imports `tokens.css` (derived by the design pipeline) and `marks.css`
# (installed by `design`), and the components it expects — button, card,
# dropdown — arrive with `design` too. Without it the first `next build` fails
# on a missing import.
#
# This held implicitly while `fid new` installed `design` into every product.
# When `fid new` became minimal, nothing declared the dependency, and a
# minimal product with `fid add app next` stopped building. So it is declared.
requires_capabilities = ["design"]

# The response headers are derived (pipelines/security-*.toml) from the platform's
# one table. The only choice a product makes is whether HSTS carries `preload`,
# which is a willingness to be submitted at hstspreload.org and slow to undo, so
# it is written down here and off.
[[declarations.config]]
block = "security"
seed = { hsts_preload = false }

# Vendor skills (https://github.com/cloudflare/skills), installed by the `skills`
# CLI like any other skill. An agent loads one before editing a Wrangler config.
[[agent_skills]]
id     = "cloudflare-workers"
source = "cloudflare/skills"
skills = ["wrangler", "workers-best-practices"]
paths  = ["**/wrangler.jsonc", "**/wrangler.json", "**/wrangler.toml"]
why    = "Wrangler configuration and the Workers runtime change between releases; Cloudflare's skills carry the current ones, and what you remember may not be."

[[agent_skills]]
id     = "cloudflare-nextjs"
source = "cloudflare/skills"
skills = ["nextjs-on-cloudflare"]
paths  = ["**/open-next.config.*"]
why    = "Next.js on Workers goes through an adapter whose configuration changes; this skill is Cloudflare's current guidance for it."

# The official shadcn skill (https://github.com/shadcn-ui/ui/tree/main/skills/shadcn).
# Components are added and updated through its CLI and registry rules, so an
# agent loads it before editing the registry config or a copied-in component.
[[agent_skills]]
id     = "shadcn"
source = "shadcn/ui"
skills = ["shadcn"]
paths  = ["**/components.json", "**/components/ui/**"]
why    = "shadcn components are added and updated through its CLI and registry rules; hand-editing them or adding one by copy drifts from the registry."
