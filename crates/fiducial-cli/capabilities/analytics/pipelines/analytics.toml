name     = "analytics"
executor = "fid-analytics"
outputs  = [
  "apps/web/src/generated/analytics.ts",
  "apps/web/src/generated/analytics-retention.ts",
]

# `[analytics]` in fiducial.toml is the declaration. The two outputs are:
#
# 1. analytics.ts — `createAnalytics(env)`: a fan-out factory that calls every
#    configured provider's `track` and `pageview` methods, isolating each failure
#    so a broken provider cannot lose events for the others.
#
# 2. analytics-retention.ts — `ANALYTICS_RETENTION_DAYS` constant and
#    `cleanupAnalyticsEvents(db)` function derived from `[analytics]
#    retention_days`. Used by the cleanup route and the SKILL.md runbook.
#
# A `requires_consent` provider in [analytics] providers without the `consent`
# capability fails this pipeline with a clear message (D22).
#
# `fid derive --check` fails when either output is missing or stale.
