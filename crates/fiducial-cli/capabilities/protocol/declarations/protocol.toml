# Every message this product's device and apps exchange, declared once.
#
# `fid derive` generates protocol/messages.rs (firmware) and
# protocol/messages.ts (web) from this table. A payload is the `kind` byte,
# then each field, little-endian. Types: u8, i8, u16, i16, u32, i32, f32.

[[message]]
name   = "status"
kind   = 1
doc    = "The device's status, sent once a second."
fields = [
  { name = "uptime_s", type = "u32", doc = "Seconds since power-on" },
  { name = "battery_mv", type = "u16", doc = "Battery voltage, millivolts" },
]
