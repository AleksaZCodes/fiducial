description = "Press kit, brand guidelines, and the stories a journalist writes from"

# Copy depends on i18n. Always.
#
# Everything this capability derives is prose a person reads: the boilerplate a
# journalist pastes, the fast facts they quote, the stories they take an angle
# from. That makes all of it a fact under MISSION.md 1c — declared once, one
# derivation per locale, and a missing translation is a missing artifact rather
# than a fallback.
#
# Installed without `i18n`, this capability would happily derive a monolingual
# press room that looks complete. Nothing would fail; the product would find
# out when a journalist who reads the other language opened the page. So the
# prerequisite is declared and `fid add` refuses without it.
# And on `content`, for one concrete reason and one structural one.
#
# Concrete: a press story is an entry with frontmatter and a markdown body, and
# it is read by the same frontmatter reader (`scripts/frontmatter.mjs`, shipped
# by `content`). That reader has to handle what a YAML writer emits — wrapped
# scalars, block sequences — because the content editor writes entries too, and
# the first story saved through one was unreadable by a line-wise parser. Two
# copies of it would be two things to fix the next time.
#
# Structural: a press room IS the content layer with a fixed shape. Boilerplate
# is a singleton, facts is a singleton, stories are a collection. Declaring
# that dependency is honest about what this capability is.
requires_capabilities = ["i18n", "content"]

# A declaration with no file of its own: a `fiducial.toml` block.
#
# Seeded so the pipeline this capability installs does not fail on the very
# next `fid derive`. `founded` and `hq` are facts only this product knows;
# `press_email` should be a real inbox someone reads, because a press contact
# nobody answers is worse than none — a journalist on deadline moves on and
# writes the story without you.
[[declarations.config]]
block = "press"
seed = { founded = "", hq = "", press_email = "press@example.com", spokesperson = "" }
