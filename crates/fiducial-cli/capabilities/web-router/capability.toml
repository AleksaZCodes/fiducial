description = "React Router 8 (framework mode) on Cloudflare Workers: routes and loaders, server-rendered, the design tokens, security headers set in the Worker"
guard_rules = ["no-unpinned-cli-fetch"]

# The stylesheet imports `tokens.css` (derived by the design pipeline) and
# `marks.css` (installed by `design`). Without `design` the first build fails on
# a missing import, as it would for `web-next`.
requires_capabilities = ["design"]

# The response headers are derived (pipelines/security-*.toml) from the platform's
# one table. The only choice a product makes is whether HSTS carries `preload`,
# which is a willingness to be submitted at hstspreload.org and slow to undo, so
# it is written down here and off.
[[declarations.config]]
block = "security"
seed = { hsts_preload = false }
