# The system: which computers exist, what connects them, and what each one
# measures and drives. Firmware tables, MQTT topics, web types and cards and
# the database schema are derived from this file by `fid derive`.

[[system]]
id    = "site"
nodes = ["controller", "server"]

[[node]]
id         = "controller"
kind       = "mcu"
target     = "riscv32imac-unknown-none-elf"
runtime    = "embassy-esp"
firmware   = "controller"
interfaces = ["wifi", "i2c0"]

[[node]]
id         = "server"
kind       = "host"
target     = "aarch64-unknown-linux-gnu"
runtime    = "linux-compose"
apps       = ["server", "web"]
interfaces = ["eth0"]

[[bus]]
id      = "sensors"
type    = "i2c"
connect = ["controller.i2c0"]

[[bus]]
id       = "lan"
type     = "ip"
protocol = "mqtt"
tls      = true
broker   = "server"
connect  = ["controller.wifi", "server.eth0"]

[[point]]
id        = "co2"
node      = "controller"
kind      = "sensor"
quantity  = "co2"
unit      = "ppm"
range     = [400, 5000]
tolerance = "50 ppm"
bus       = "sensors"
address   = 0x62

[[point]]
id   = "fan"
node = "controller"
kind = "actuator"
net  = "RELAY_FAN"

[[rule]]
id     = "ventilation"
scope  = "controller"
reads  = ["co2"]
drives = ["fan"]
doc    = "The fan runs above co2_on and stops below co2_off."

[[parameter]]
id      = "co2_on"
scope   = "controller"
unit    = "ppm"
range   = [600, 2000]
default = 1000
rule    = "ventilation"
limits  = "co2"

[[parameter]]
id      = "co2_off"
scope   = "controller"
unit    = "ppm"
range   = [400, 1800]
default = 800
rule    = "ventilation"
limits  = "co2"
