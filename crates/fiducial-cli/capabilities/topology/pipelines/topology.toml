name     = "topology"
executor = "fid-topology"
outputs  = [
  "firmware/controller/src/generated/points.rs",
  "firmware/controller/src/generated/params.rs",
  "crates/messages/src/generated/topics.rs",
  "apps/web/src/generated/points.ts",
  "apps/web/src/generated/cards.ts",
  "migrations/0001_topology.sql",
]

# topology.toml in; per firmware role a point table and a parameter table,
# one topic table for every node, the web's point types and cards, and the
# server's schema. A firmware role added to topology.toml fails derive until
# its two outputs are listed here.
