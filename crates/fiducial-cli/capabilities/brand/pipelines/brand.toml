name     = "brand"
executor = "fid-brand"
outputs  = [
  "apps/web/public/robots.txt",
  "apps/web/public/sitemap.xml",
  "apps/web/public/site.webmanifest",
  "apps/web/public/favicon.svg",
  "apps/web/public/organization.jsonld",
  "apps/web/src/generated/brand.ts",
]

# `[brand]` in fiducial.toml is the declaration. Each output is derived from it
# by `fid-brand`, addressed by file name — the name says which artifact, this
# list says where it lands.
#
# The paths are under `apps/web/`, where the web app serves static files from
# and where `seo`, `cms` and the OG renderer read `generated/brand.ts`. They
# used to be `public/` and `src/generated/` at the product root, which Next
# never served and the app could not import, so a product had to move them by
# hand before robots.txt, the favicon or the brand module reached anyone.
#
# `apps/web/src/generated/brand.ts` is the odd one out and the important one: every other
# output here is read by a crawler, and none of them can be imported by the
# application. Without it, the first time app code needs the domain — a
# canonical URL, `metadataBase`, an absolute OG image — it gets retyped, and the
# copy is then wrong the day the domain moves, silently. Point application code
# at this module instead of writing an origin into it.
#
# `apps/web/public/` is the Next.js static-asset convention. A SvelteKit product
# should change these five paths to `apps/web/static/…` — the declaration does
# not move, only where the derivation is written.
#
# `fid derive --check` fails when any of these five files is missing or stale
# against `fiducial.lock`, the same as every other pipeline's outputs.
#
# Not yet derived here, deliberately: raster favicons/OG images, a press kit,
# social templates, and email themes. Those need a rendering step (fonts,
# rasterization) this pipeline does not carry yet — see ROADMAP.md § Brand.
