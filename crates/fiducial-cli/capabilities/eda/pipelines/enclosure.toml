# Enclosure mesh pipeline — derives printable geometry from the board outline.
#
# Reads the `outline` block declared in board/board.interface.json and generates
# a gasket-sealed two-part case sized by the board's tolerance class. Every
# connector that declares a `mount` is punched through the base wall it faces,
# and `outline.enclosure.standoff_height_mm` lifts the board onto corner posts.
# Runs in-process via fiducial-mesh; no CAD tool is required.
#
# The declaration is validated before anything is written: an opening that
# reaches the gasket groove fails the pipeline rather than shipping a case that
# slices cleanly and leaks.
#
#   fid derive           regenerate every output below, record hashes
#   fid derive --check   fail if any output is stale
#
# Each output is addressed by stem and extension, which are independent: the
# stem picks the part, the extension picks the format (.stl or .glb).
#
#   case-base  base tray with the gasket groove       print rigid
#   case-lid   lid with the compression tongue        print rigid
#   gasket     the seal                               PRINT IN TPU
#   case       exploded assembly, for rendering
#   board      the bare PCB, extruded
#   tray       simple open tray, no seal
#
# The gasket must be printed in TPU or another flexible filament. A rigid
# gasket cannot compress, so the case will not seal.
name     = "enclosure"
executor = "fid-mesh"
args     = ["board/board.interface.json"]

outputs = [
  "enclosure/case-base.stl",
  "enclosure/case-lid.stl",
  "enclosure/gasket.stl",
  "enclosure/case.glb",

  # ── Optional: serve the preview from the web app ─────────────────────────
  # Uncomment the line below if you installed the `web-next` capability. It
  # writes the exploded-case GLB straight into the app's public directory, so
  # /board renders current geometry with no copy step and no stale file — the
  # artifact is tracked in fiducial.lock like any other, so `fid derive --check`
  # catches it drifting.
  #
  # Leave it commented if you have no web app; nothing else depends on it.
  #
  # "apps/web/public/case.glb",
]
