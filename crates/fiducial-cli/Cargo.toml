[package]
name        = "fiducial-cli"
description = "fid — the Fiducial platform CLI"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
authors.workspace     = true
rust-version.workspace = true
keywords    = ["cli", "fiducial", "scaffold", "cross-platform"]
categories  = ["command-line-utilities", "development-tools"]

[[bin]]
name = "fid"
path = "src/main.rs"

[dependencies]
clap         = { version = "4",   features = ["derive"] }
anyhow       = "1"
serde        = { version = "1",   features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
sha2         = "0.10"
hex          = "0.4"
chrono       = { version = "0.4", default-features = false, features = ["clock"] }
diffy        = "0.4"
fiducial-eda      = { path = "../fiducial-eda", features = ["std"] }
fiducial-geometry = { path = "../fiducial-geometry", features = ["std"] }
fiducial-mesh     = { path = "../fiducial-mesh", features = ["std"] }

[dev-dependencies]
tempfile = "3"
