[package]
name        = "fiducial-cli"
description = "fid — the Fiducial platform CLI"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
authors.workspace     = true
rust-version.workspace = true
keywords    = ["cli", "fiducial", "scaffold", "cross-platform"]
categories  = ["command-line-utilities", "development-tools"]

[[bin]]
name = "fid"
path = "src/main.rs"

[dependencies]
clap       = { workspace = true, features = ["derive"] }
anyhow     = { workspace = true }
serde      = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
toml       = { workspace = true }
sha2       = { workspace = true, features = ["std"] }
hex        = { workspace = true }
chrono     = { workspace = true, features = ["clock"] }
diffy      = { workspace = true }
fiducial-eda      = { workspace = true, features = ["std"] }
fiducial-geometry = { workspace = true, features = ["std"] }
fiducial-mesh     = { workspace = true, features = ["std"] }
fiducial-protocol = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile          = { workspace = true }
walkdir           = { workspace = true }
fiducial-protocol = { workspace = true }
