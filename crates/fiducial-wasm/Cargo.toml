[package]
name        = "fiducial-wasm"
description = "WASM bindings for fiducial-core — browser, edge, and Cloudflare Workers."
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
authors.workspace     = true
rust-version.workspace = true
keywords    = ["wasm", "wasm-bindgen", "fiducial", "browser"]
categories  = ["wasm", "api-bindings"]

# cdylib  → the .wasm file (built by wasm-pack)
# rlib    → allows `cargo check` and tests on the host target
[lib]
name       = "fiducial_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
fiducial-core = { workspace = true }
wasm-bindgen  = { workspace = true }
ts-rs         = { workspace = true, optional = true }

# ts-rs generates TypeScript type definitions from Rust types.
# Run `cargo test --features ts -p fiducial-wasm` to emit them to
# packages/wasm-bridge/src/generated.ts.
# Hand-writing a type that crosses this boundary is guard-blocked (spec §7, Appendix A).
[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[features]
ts = ["ts-rs"]
