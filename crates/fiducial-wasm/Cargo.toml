[package]
name        = "fiducial-wasm"
description = "WASM bindings for fiducial-core — browser, edge, and Cloudflare Workers."
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
authors.workspace     = true
rust-version.workspace = true
keywords    = ["wasm", "wasm-bindgen", "fiducial", "browser"]
categories  = ["wasm", "api-bindings"]

# cdylib  → the .wasm file (built by wasm-pack)
# rlib    → allows `cargo check` and tests on the host target
[lib]
name       = "fiducial_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
fiducial-core = { path = "../fiducial-core" }
wasm-bindgen  = "0.2"

# ts-rs generates TypeScript type definitions from Rust types.
# Run `cargo test --features ts` to emit them to packages/wasm-bridge/src/types.ts.
# Hand-writing a type that crosses this boundary is guard-blocked (Phase 3).
[dev-dependencies]
wasm-bindgen-test = "0.3"
