[package]
name        = "fiducial-mesh"
description = "no_std case generation from a board outline: gasket-sealed base/lid/gasket, connector cutouts, standoffs, fasteners; binary STL + GLB export."
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
authors.workspace     = true
rust-version.workspace = true
keywords    = ["no-std", "mesh", "stl", "gltf", "fiducial"]
categories  = ["no-std", "rendering"]

[lib]
name = "fiducial_mesh"

[features]
default = []
alloc   = []
std     = ["alloc"]

[dependencies]
fiducial-geometry = { path = "../fiducial-geometry", features = ["alloc"] }
libm              = "0.2"
