[package]
name        = "fiducial-adapters"
description = "Cross-platform adapter contracts for Fiducial — database, storage, email, diagnostics."
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
authors.workspace     = true
rust-version.workspace = true
keywords    = ["adapters", "database", "storage", "fiducial", "cross-platform"]
categories  = ["api-bindings", "asynchronous"]

[features]
# The self-hosted target's implementations (`docs/specs/2026-11-01-a-self-hosted-target.md`).
# Off by default: a product that does not ship its own server pays for none of it.
sqlite = ["dep:sqlx", "dep:tokio"]
native = ["dep:argon2", "dep:hmac", "dep:sha2", "dep:base64"]
ollama = ["dep:reqwest", "dep:serde_json", "dep:futures-util", "dep:tokio"]

[dependencies]
thiserror    = { workspace = true }
futures-core = { workspace = true }

sqlx        = { workspace = true, optional = true, features = ["runtime-tokio", "sqlite"] }
tokio       = { workspace = true, optional = true, features = ["rt"] }
argon2      = { workspace = true, optional = true, features = ["alloc", "password-hash", "std", "rand"] }
hmac        = { workspace = true, optional = true }
sha2        = { workspace = true, optional = true }
base64      = { workspace = true, optional = true, features = ["alloc"] }
reqwest     = { workspace = true, optional = true, features = ["json", "stream"] }
serde_json  = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tokio        = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
futures-util = { workspace = true }
