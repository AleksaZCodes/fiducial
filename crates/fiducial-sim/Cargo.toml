[package]
name        = "fiducial-sim"
description = "Numerical simulation — runs native (with rayon) and in WASM (single-threaded)"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true

# `std` is the default; WASM consumers compile with --no-default-features.
[features]
default  = ["std", "parallel"]
std      = []
parallel = ["dep:rayon"]

[dependencies]
# rayon is optional — WASM uses the single-threaded path
rayon = { version = "1", optional = true }

# serde for serialising simulation snapshots
serde = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
serde_json = "1"
