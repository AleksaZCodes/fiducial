[package]
name        = "fiducial-sim"
description = "Numerical simulation — ODE integration that runs native (with rayon) and in WASM (single-threaded)."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
rust-version.workspace = true
keywords    = ["simulation", "ode", "runge-kutta", "wasm", "fiducial"]
categories  = ["simulation", "science", "wasm"]

[lib]
name = "fiducial_sim"

# `std` is the default; WASM consumers compile with --no-default-features.
[features]
default  = ["std", "parallel"]
std      = []
parallel = ["dep:rayon"]

[dependencies]
# rayon is optional — WASM uses the single-threaded path
rayon = { workspace = true, optional = true }

# serde for serialising simulation snapshots
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
