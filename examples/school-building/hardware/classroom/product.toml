# Classroom controller: the same ESP32-C6-DevKitC in every classroom.

[board]
kind = "modules"
mcu  = "mcu"

[[module]]
id   = "mcu"
part = "esp32-c6-devkitc-1"

[[module]]
id   = "scd41"
part = "sensirion-scd41"

[[module]]
id   = "bh1750"
part = "rohm-bh1750"

[[module]]
id   = "t_out"
part = "ds18b20-probe"

[[module]]
id   = "relays"
part = "relay-4ch-opto"

[[module]]
id   = "buzzer"
part = "buzzer-active-3v3"

[[module]]
id   = "all_stop"
part = "contact-aux"

[[module]]
id   = "blind_auto"
part = "contact-aux"

[[module]]
id   = "recuperator_auto"
part = "contact-aux"

[[module]]
id   = "psu"
part = "supply-5v-din-mp15s"

[[wire]]
net    = "5V"
ends   = ["psu.+V", "mcu.5V", "relays.VCC"]
colour = "red"

[[wire]]
net    = "3V3"
ends   = ["mcu.3V3", "scd41.VDD", "bh1750.VCC", "t_out.VDD"]
colour = "orange"

[[wire]]
net    = "GND"
ends   = ["psu.-V", "mcu.GND", "scd41.GND", "bh1750.GND", "bh1750.ADDR", "t_out.GND", "relays.GND", "buzzer.-", "all_stop.C2", "blind_auto.C2", "recuperator_auto.C2"]
colour = "black"

[[wire]]
net    = "SDA"
ends   = ["mcu.GPIO6", "scd41.SDA", "bh1750.SDA"]
colour = "blue"

[[wire]]
net    = "SCL"
ends   = ["mcu.GPIO7", "scd41.SCL", "bh1750.SCL"]
colour = "yellow"

[[wire]]
net    = "ONEWIRE"
ends   = ["mcu.GPIO3", "t_out.DQ"]
colour = "blue"

[[wire]]
net    = "RELAY_BLIND_UP"
ends   = ["mcu.GPIO18", "relays.IN1"]
colour = "green"

[[wire]]
net    = "RELAY_BLIND_DOWN"
ends   = ["mcu.GPIO19", "relays.IN2"]
colour = "green"

[[wire]]
net    = "RELAY_RECUPERATOR"
ends   = ["mcu.GPIO20", "relays.IN3"]
colour = "green"

[[wire]]
net    = "BUZZER"
ends   = ["mcu.GPIO21", "buzzer.+"]
colour = "purple"

[[wire]]
net    = "ALL_STOP"
ends   = ["mcu.GPIO2", "all_stop.C1"]
colour = "grey"

[[wire]]
net    = "BLIND_AUTO"
ends   = ["mcu.GPIO22", "blind_auto.C1"]
colour = "grey"

[[wire]]
net    = "RECUPERATOR_AUTO"
ends   = ["mcu.GPIO23", "recuperator_auto.C1"]
colour = "grey"
