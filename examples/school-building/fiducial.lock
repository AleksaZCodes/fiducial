[templates."pipelines/i18n.toml"]
source_version = "0.9.12"
hash = "6c2ced6d61ffdfff6c05cd723b4c1cf7a996ecc4f01157ff995ce762b8c854fe"
base_content = """
name     = "i18n"
executor = "fid-i18n"
# args = ["messages"]   # only to override [i18n] messages_dir
outputs  = ["apps/web/src/generated/messages.ts"]

# Message catalogs in, typed keys out.
#
# `messages/<locale>.json` is the declaration. `apps/web/src/generated/messages.ts` is
# derived from it and must never be hand-edited — it is guard-blocked and
# rewritten on every `fid derive`.
#
# The generated module exports a `MessageKey` union, so a mistyped key is a
# COMPILE ERROR rather than a string rendered to a reader.
#
# `fid derive --check` fails when a locale is missing a key the default locale
# has, or when a placeholder differs between locales. It reports — without
# failing — a value identical to the default (likely untranslated) and a key the
# default does not have (likely leftover).
#
# The default locale comes from [i18n] in fiducial.toml.
#
# The output is where this capability's own `intl.ts`, `locale-href.ts` and
# locale pickers import it from — `apps/web/src/generated/`. It used to be
# `src/generated/` at the product root, which nothing imported, so every
# product that installed i18n beside a web app failed to typecheck until it
# hand-edited this line. Change it only if your app lives somewhere else.
"""

[templates."pipelines/thesis.toml"]
source_version = "0.9.12"
hash = "a5d4f4e2f603e00abf72064259499e83927725f1a5b3ad64f6b6762c7d46f81c"
base_content = """
name     = "thesis"
executor = "fid-thesis"
outputs  = [
  "PITCH.md",
  "apps/web/src/generated/thesis.ts",
]

# `thesis.toml` is the declaration. These are what it derives.
#
# `PITCH.md` is the arc assembled in the order you would say it out loud —
# what, for whom, the problem, why now, why us, how, where, then what would
# prove it wrong and where it actually stands. Sections you have not declared
# are left out rather than stubbed, so a partial pitch reads as one you are
# still working out instead of as an unfilled form.
#
# `thesis.ts` is the same claim as a typed constant, so a landing page or a
# metadata export *imports* the sentence instead of retyping it. That is the
# entire point: the wording lives in one file and everything else points at it.
#
# Both outputs wait for what they need. No thesis declared yet → nothing is
# derived and `fid derive --check` does not ask for either, so a product is
# never blocked on having thought of its claim. No app at `apps/web` → the
# TypeScript module is not applicable and `PITCH.md` derives on its own, which
# is what a product with a thesis and no website should get.
#
# `apps/web` is the `fid add app next` convention. A SvelteKit product moves
# that second path; the declaration does not move.
#
# Deliberately NOT derived here: README.md, the i18n catalogs, and the hero
# copy. Those stay hand-written, and `fid advise` checks them against the claim
# instead — flagging drift without rewriting. A generated region inside a
# translated catalog would mean deriving every locale from an English sentence
# through a pipeline that has no translator.
"""

[templates."thesis.toml"]
source_version = "0.10.0"
hash = "99a17566e8293d5bba605b33c55b5752001cef5aad5818f5a3c615e8a672f925"
base_content = """
# thesis.toml — what skola claims, and what would prove it wrong.
#
# Scaffolded by `fid new` (fiducial 0.10.0). Product-owned, and the one
# file here worth filling in before anything else exists.
#
# A thesis is the single claim this product is built to test. Not a description
# of what it does — a claim someone could argue with. If nobody could disagree
# with it, it is a slogan and it will not help you decide anything.
#
# This file is APPEND-ONLY. When the claim sharpens, add a new [[thesis]] that
# supersedes the old one and says why; never edit an entry. How the thinking
# matured is most of what a reader wants, and editing a sentence destroys it.
#
# `claim` is the only required field. One rough line is a valid thesis and
# nothing here blocks a build — `fid derive` produces identical bytes whether
# this is complete or a stub. Fill the rest in as it becomes answerable.
#
#   fid thesis           what is claimed, and what is still unanswered
#   fid thesis log       how the claim got here
#   fid advise           is it falsifiable? could a reasonable person disagree?

# Nothing is declared yet, and that is a valid state: no thesis means no
# PITCH.md, and `fid derive --check` does not ask for one. Declare the first
# claim whenever you have it —
#
#   fid thesis set "One sentence someone could disagree with."
#
# — or uncomment the block below and write it here. Either way the rest of this
# file is yours to fill in over time.
#
# [[thesis]]
# date  = "2026-01-01"
# claim = "One sentence someone could disagree with."

# The pitch, in the order you would say it out loud. `fid derive` assembles
# PITCH.md from exactly these, skipping whatever is not yet declared.
#
# [thesis.arc]
# what     = "What are you making?"
# for_whom = "Who is it for? Specifically enough to go and find one."
# problem  = "The tension it resolves. A conflict, not a topic."
# why_now  = "What changed that makes this possible or urgent now?"
# why_us   = "What do you carry that someone starting today does not?"
# how      = "The mechanism — the smallest thing that would test the claim."
# where    = "The geography, channel or context this happens in."

# What makes it a thesis rather than a slogan. Fill these first if you fill
# anything: a claim that cannot be wrong cannot be useful.
#
# [thesis.test]
# falsified_by = "What would you have to observe to admit this is wrong?"
# disagrees    = "Who is the reasonable person who disagrees, and why?"

# What may honestly be claimed today, kept separate from what is intended.
# This is what stops a derived pitch from overclaiming while you are still
# building — say the unproven part plainly here and it stays said everywhere.
#
# [thesis.evidence]
# proven  = ["What you have actually shown."]
# not_yet = ["What you have not."]
"""

