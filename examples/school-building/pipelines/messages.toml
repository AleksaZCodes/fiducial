# The product's messages, declared once as Rust types in crates/skola-messages.
#
# Devices exchange them as postcard bytes; the server and the browser exchange
# them as JSON. The TypeScript types are exported by ts-rs while the crate's
# tests run, so a field changed in Rust is a stale artifact until re-derived,
# and the tests also fail when a reason code has no message in a catalog.

name     = "messages"
executor = "shell"
args     = ["cargo", "test", "--quiet", "-p", "skola-messages", "--features", "ts"]
inputs   = ["crates/skola-messages/Cargo.toml", "crates/skola-messages/src/lib.rs", "messages/*.json"]
outputs  = [
  "apps/web/src/generated/wire/Action.ts",
  "apps/web/src/generated/wire/Alarm.ts",
  "apps/web/src/generated/wire/AlarmKind.ts",
  "apps/web/src/generated/wire/Command.ts",
  "apps/web/src/generated/wire/CommandAck.ts",
  "apps/web/src/generated/wire/Outcome.ts",
  "apps/web/src/generated/wire/Output.ts",
  "apps/web/src/generated/wire/Reading.ts",
  "apps/web/src/generated/wire/Reason.ts",
  "apps/web/src/generated/wire/Selector.ts",
  "apps/web/src/generated/wire/Slot.ts",
  "apps/web/src/generated/wire/State.ts",
  "apps/web/src/generated/wire/Status.ts",
  "apps/web/src/generated/wire/Threshold.ts",
  "apps/web/src/generated/wire/Thresholds.ts",
  "apps/web/src/generated/wire/Timetable.ts",
]
