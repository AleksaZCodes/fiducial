[package]
name        = "firmware-rp2040"
description = "RP2040 firmware for sensor-stick."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "firmware-rp2040"
path = "src/main.rs"

[dependencies]
firmware-shared = { path = "../shared" }

embassy-executor = { workspace = true, features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-rp = { workspace = true, features = [
    "rp2040",
    "defmt",
    "time-driver",
    "critical-section-impl",
] }
embassy-time = { workspace = true, features = [
    "defmt",
    "defmt-timestamp-uptime",
] }

defmt       = { workspace = true }
defmt-rtt   = { workspace = true }
panic-probe = { workspace = true }

cortex-m    = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-usb     = { workspace = true, features = ["defmt"] }
embassy-futures = { workspace = true }
static_cell     = { workspace = true }
smart-leds      = { workspace = true }
portable-atomic = { version = "1", features = ["critical-section"] }  # the M0+ has no atomic compare-and-swap
