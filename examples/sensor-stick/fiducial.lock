base_content = '''
#!/usr/bin/env python3
"""Vendor every declared part's KiCad component into hardware/lib/.

    python3 hardware/parts.py resolve    answer every `pick` from the catalogue; write hardware/parts.lock
    python3 hardware/parts.py sync       resolve, copy, fetch; write manifest.json
    python3 hardware/parts.py check      fail if hardware/lib/ or parts.lock does not match the declaration
    python3 hardware/parts.py fetch C2040   an LCSC part's symbol, footprint and model → hardware/vendor/lcsc

Platform-owned (installed by `fid add capability hardware`).

A part is not a box someone typed. It is a component in the formats the EDA
world already uses — a KiCad symbol, a KiCad footprint, a STEP model — taken
from a standard source, never redrawn. A part in hardware/product.toml names
them by library id:

    symbol    = "Regulator_Linear:AMS1117-3.3"
    footprint = "Package_DFN_QFN:QFN-20-1EP_3.5x3.5mm_P0.5mm_EP2x2mm"

`sync` copies them into the repository, so the product builds the same on a
laptop, in CI and in a cloud session, with no KiCad library installed:

    hardware/lib/footprints/<name>.kicad_mod
    hardware/lib/symbols.kicad_sym           every declared symbol, one library
    hardware/lib/3d/<name>.step              the footprint's own model
    hardware/lib/datasheets/<name>.pdf       the manufacturer's datasheet, from `datasheet = "<url>"`
    hardware/lib/datasheets/<name>.txt       its text, for an agent to search (needs pypdf)
    hardware/lib/manifest.json               where each file came from, and its hash
    hardware/lib/PARTS.md                    every part on one page: what it is, its files, its pins

PARTS.md is the hardware's context for a person or an agent: the one place
that says, per part, which symbol, footprint, model and datasheet it uses and
what each pin connects to, with links to the files. It is regenerated by every
`sync`, and `check` fails when it is stale.

A datasheet the network cannot reach is reported, never invented: download it
by hand to hardware/vendor/datasheets/<name>.pdf (vendor first, as for every
other file) and sync again.

fid-hardware then reads the footprint — the courtyard is the part's size, the
pads are its pins — and tracks the vendored files as inputs, so a changed
footprint fails `fid derive --check` by name. cad.py places the real model.

Sources, in order:

1. hardware/vendor/ — the product's own libraries, laid out as KiCad lays out
   its own (`<Lib>.pretty/<Name>.kicad_mod`, `<Lib>.kicad_sym`,
   `<Lib>.3dshapes/<Name>.step`), each with a SOURCES.md saying where every
   number came from. For a part the official libraries lack: a module whose
   land pattern is taken from a board that uses it, a symbol from an openly
   licensed library. Never a drawing from memory.
2. the KiCad libraries installed on this machine (KICAD7_FOOTPRINT_DIR /
   KICAD7_SYMBOL_DIR, default /usr/share/kicad/...);
3. the KiCad 3D-model repository for the model, at the tag matching the
   footprints.

Parts are packages. A commodity part — a resistor, a capacitor — is declared
by what it must be, not by a catalogue number someone looked up:

    pick = { category = "Resistors", package = "0603", value = "10k", has = ["1%"], tier = "basic" }

`resolve` answers it from the JLCPCB catalogue (yaqwsx/jlcparts, as
published by CDFER/jlcpcb-parts-database): the in-stock part that matches,
lowest tier first (basic, then preferred, then extended — what JLCPCB's
assembly charges no loading fee for comes first), then cheapest at the
quantity built, then most stocked. The answer is written to
hardware/parts.lock, with its LCSC number, MPN, stock and price, and kept
there: like a Cargo.lock, a locked pick is not re-picked until the pick
changes or `resolve --update` is asked for. The lock is committed, so derive
and CI never need the network; only `resolve` does. `fid derive` fails while
any pick is unanswered, and takes the LCSC number from the lock into the
BOM and the assembly files.

    pick fields:  category  matched against the catalogue's category or subcategory
                  package   the catalogue's package, exactly ("0603", "SOT-23-5")
                  value     a value token in the description: "10k", "100nF", "4k7"
                  has       further words the description must contain: ["1%", "X7R"]
                  mpn       the manufacturer part number, exactly
                  tier      basic (default) | preferred | extended — the highest allowed

The catalogue: FID_PARTS_CATALOGUE or `--catalogue` (a CSV, or the full
in-stock SQLite database for extended parts), else the basic/preferred CSV
downloaded once into ~/.cache/fiducial/.

A part with an LCSC number that no KiCad library has (most ICs) is fetched by
`fetch`, through easyeda2kicad, into hardware/vendor/lcsc.{kicad_sym,pretty,
3dshapes} — the vendor layout below — and declared as `lcsc:<Name>`.

What cannot be resolved is reported, not invented. A footprint whose model
no library ships is built by cad.py from the footprint itself — its fab
outline, its pads, the declared height — and the build says so.
"""

from __future__ import annotations

import csv
import datetime
import hashlib
import json
import os
import re
import shutil
import sys
import sqlite3
import subprocess
import tomllib
import urllib.request
from pathlib import Path

ROOT = Path(__file__).resolve().parent.parent
DECL = ROOT / "hardware" / "product.toml"
LIB = ROOT / "hardware" / "lib"
VENDOR = ROOT / "hardware" / "vendor"
FP_DIR = Path(os.environ.get("KICAD7_FOOTPRINT_DIR", "/usr/share/kicad/footprints"))
SYM_DIR = Path(os.environ.get("KICAD7_SYMBOL_DIR", "/usr/share/kicad/symbols"))
MODEL_TAG = os.environ.get("KICAD_LIB_TAG", "7.0.11")
MODEL_URL = "https://gitlab.com/kicad/libraries/kicad-packages3D/-/raw/{tag}/{lib}.3dshapes/{name}.step"


LOCK = ROOT / "hardware" / "parts.lock"
CATALOGUE_URL = "https://cdfer.github.io/jlcpcb-parts-database/jlcpcb-components-basic-preferred.csv"
TIERS = ("basic", "preferred", "extended")
PICK_KEYS = ("category", "package", "value", "has", "mpn", "tier")


def sha(p: Path) -> str:
    return hashlib.sha256(p.read_bytes()).hexdigest()


def split_id(lib_id: str) -> tuple[str, str]:
    if ":" not in lib_id:
        raise SystemExit(f"`{lib_id}` is not a library id — expected Library:Name")
    lib, name = lib_id.split(":", 1)
    return lib, name


def symbol_block(text: str, name: str) -> str | None:
    """The whole `(symbol "name" …)` block at top level of a .kicad_sym, by paren matching."""
    m = re.search(r'\n\s*\(symbol "' + re.escape(name) + r'"', text)
    if not m:
        return None
    i = text.index("(", m.start())
    depth = 0
    in_str = False
    for j in range(i, len(text)):
        c = text[j]
        if c == '"' and text[j - 1] != "\\":
            in_str = not in_str
        elif not in_str:
            if c == "(":
                depth += 1
            elif c == ")":
                depth -= 1
                if depth == 0:
                    return text[i : j + 1]
    return None


def children(block: str) -> list[str]:
    """The s-expressions directly inside a block, in order."""
    out, depth, in_str, start = [], 0, False, 0
    for j, c in enumerate(block):
        if c == '"' and block[j - 1] != "\\":
            in_str = not in_str
        elif not in_str and c == "(":
            depth += 1
            if depth == 2:
                start = j
        elif not in_str and c == ")":
            if depth == 2:
                out.append(block[start : j + 1])
            depth -= 1
    return out


def flatten(text: str, block: str, name: str) -> str | None:
    """A symbol that `extends` another, made whole: the parent's pins and
    drawing under this symbol's own name and properties. KiCad's libraries
    derive most variants this way (AMS1117-3.3 extends AP1117-15), and a
    schematic needs the whole symbol. None when the parent is not in `text`."""
    m = re.search(r'\(extends "([^"]+)"\)', block[:400])
    if not m:
        return block
    parent_name = m.group(1)
    parent = symbol_block(text, parent_name)
    parent = parent and flatten(text, parent, parent_name)
    if parent is None:
        return None
    own = [c for c in children(block) if c.startswith("(property")]
    kept = [
        c.replace(f'(symbol "{parent_name}_', f'(symbol "{name}_', 1) if c.startswith("(symbol") else c
        for c in children(parent)
        if not c.startswith("(property")
    ]
    return f'(symbol "{name}"\n    ' + "\n    ".join(own + kept) + ")"


def open_url(url: str, timeout: float):
    """GET with a User-Agent: LCSC answers 403 to a request without one."""
    return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "fiducial-parts"}), timeout=timeout)


def fetch(url: str, dest: Path) -> str | None:
    try:
        dest.parent.mkdir(parents=True, exist_ok=True)
        with open_url(url, 60) as r:
            dest.write_bytes(r.read())
        return None
    except Exception as e:  # noqa: BLE001 — reported, not raised
        return f"{type(e).__name__}: {e}"


def datasheet_name(part: dict) -> str:
    """The file a part's datasheet is kept as: its MPN, else its id."""
    return re.sub(r"[^A-Za-z0-9._-]+", "_", part.get("mpn") or part["id"])


def pdf_text(pdf: Path, txt: Path) -> str | None:
    """A text copy of a PDF, so an agent can grep the datasheet. pypdf if installed."""
    try:
        from pypdf import PdfReader  # type: ignore
    except ImportError:
        return "pypdf is not installed (pip install pypdf) — no text copy"
    except (KeyboardInterrupt, SystemExit):
        raise
    except BaseException as e:  # noqa: BLE001 — a broken install panics, not raises
        return f"pypdf failed to load ({type(e).__name__}) — no text copy"
    try:
        pages = PdfReader(str(pdf)).pages
        txt.write_text("\n\n".join(f"--- page {i + 1} ---\n{p.extract_text() or ''}" for i, p in enumerate(pages)))
        return None
    except Exception as e:  # noqa: BLE001 — reported, not raised
        return f"{type(e).__name__}: {e}"


LCSC_DETAIL = os.environ.get("FID_LCSC_DETAIL", "https://wmsc.lcsc.com/ftps/wm/product/detail?productCode={code}")


def lcsc_datasheet(code: str) -> tuple[str | None, str | None]:
    """The datasheet URL LCSC lists for a part number: (url, error)."""
    try:
        with open_url(LCSC_DETAIL.format(code=code), 30) as r:
            url = (json.loads(r.read()).get("result") or {}).get("pdfUrl")
        return (url, None) if url else (None, "LCSC lists no datasheet")
    except Exception as e:  # noqa: BLE001 — reported, not raised
        return None, f"{type(e).__name__}: {e}"


def datasheet(part: dict, problems: list[str], earlier: dict) -> dict | None:
    """Declared `datasheet`, else the one LCSC lists for the part's `lcsc` number."""
    url = part.get("datasheet") or earlier.get("url")
    if not url and part.get("lcsc") and part.get("status") != "assumed":
        url, err = lcsc_datasheet(part["lcsc"])
        if err:
            name = datasheet_name(part)
            if (VENDOR / "datasheets" / f"{name}.pdf").exists():
                url = "vendored"
            else:
                problems.append(
                    f"{part['id']}: no datasheet URL — declare `datasheet`, or let LCSC {part['lcsc']} answer ({err}); "
                    f"or save it as hardware/vendor/datasheets/{name}.pdf"
                )
                return {"url": None, "file": None}
    if not url:
        return None
    name = datasheet_name(part)
    (LIB / "datasheets").mkdir(parents=True, exist_ok=True)
    dest = LIB / "datasheets" / f"{name}.pdf"
    own = VENDOR / "datasheets" / f"{name}.pdf"
    entry: dict = {"url": url, "file": f"datasheets/{name}.pdf"}
    if part.get("datasheet") and earlier.get("url") not in (None, part["datasheet"]):
        dest.unlink(missing_ok=True)  # the declaration names a different document now
    if own.exists():
        shutil.copyfile(own, dest)
        entry["from"] = str(own.relative_to(ROOT))
    elif url == "vendored":
        problems.append(f"{part['id']}: datasheet named vendored but hardware/vendor/datasheets/{name}.pdf is gone")
        return {"url": None, "file": None}
    elif not dest.exists():
        err = fetch(url, dest)
        if err is None and not dest.read_bytes().startswith(b"%PDF"):
            err = "the URL did not return a PDF"
        if err:
            dest.unlink(missing_ok=True)
            problems.append(f"{part['id']}: datasheet {url} could not be fetched ({err}) — save it as hardware/vendor/datasheets/{name}.pdf")
            return {"url": url, "file": None}
        entry["from"] = url
        entry["fetched"] = datetime.date.today().isoformat()
    else:
        entry["from"] = "fetched earlier"
    entry["sha256"] = sha(dest)
    txt = dest.with_suffix(".txt")
    if not txt.exists() or txt.stat().st_mtime < dest.stat().st_mtime:
        err = pdf_text(dest, txt)
        if err:
            problems.append(f"{part['id']}: datasheet text: {err}")
    if txt.exists():
        entry["text"] = f"datasheets/{name}.txt"
    return entry


def parts_md(decl: dict, manifest: dict) -> str:
    """Every part on one page — the hardware's context for a person or an agent."""
    rel = lambda f: f"[{f}]({f})"  # noqa: E731 — links resolve from hardware/lib/
    out = [
        "# Parts",
        "",
        "Generated by `python3 hardware/parts.py sync` from `hardware/product.toml` — do not edit.",
        "Per part: what it is, where it came from, its KiCad files, its datasheet, and what each pin connects to.",
        "Paths are relative to `hardware/lib/`. Search a datasheet's `.txt` before reading the PDF.",
        "",
        "| id | part | value | MPN | LCSC | status | datasheet |",
        "|---|---|---|---|---|---|---|",
    ]
    for part in decl.get("part", []):
        e = manifest["parts"].get(part["id"], {})
        ds = e.get("datasheet") or {}
        dcell = rel(ds["file"]) if ds.get("file") else ("**missing**" if ds else "—")
        out.append(
            f"| `{part['id']}` | {part.get('name', '')} | {part.get('value', '')} | {part.get('mpn', '')} | "
            f"{part.get('lcsc', '')} | {part.get('status', '')} | {dcell} |"
        )
    for part in decl.get("part", []):
        e = manifest["parts"].get(part["id"], {})
        out += ["", f"## `{part['id']}` — {part.get('name', '')}", ""]
        facts = [
            ("place / mount", f"{part.get('place', '')} / {part.get('mount', '')}"),
            ("manufacturer", part.get("manufacturer")),
            ("MPN", part.get("mpn")),
            ("second source", part.get("second_source")),
            ("LCSC", part.get("lcsc")),
            ("value", part.get("value")),
            ("quantity", part.get("qty")),
            ("status", part.get("status")),
            ("dimensions from", part.get("dims_from") or ("footprint" if part.get("footprint") else None)),
            ("source", part.get("source_url")),
            ("still to settle", part.get("settle_by")),
        ]
        for k, v in facts:
            if v not in (None, ""):
                out.append(f"- **{k}:** {v}")
        if "symbol" in e:
            out.append(f"- **symbol:** `{e['symbol']['id']}` (in [symbols.kicad_sym](symbols.kicad_sym))")
        if "footprint" in e:
            out.append(f"- **footprint:** `{e['footprint']['id']}` → {rel('footprints/' + split_id(e['footprint']['id'])[1] + '.kicad_mod')}")
        if "model" in e:
            out.append(f"- **3D model:** {rel(e['model']['file'])}")
        ds = e.get("datasheet")
        if ds:
            if ds.get("file"):
                text = f", text {rel(ds['text'])}" if ds.get("text") else ""
                out.append(f"- **datasheet:** {rel(ds['file'])}{text} — from {ds['url']}")
            else:
                out.append(f"- **datasheet:** not yet fetched — {ds['url'] or 'no URL known'}; see `problems` in manifest.json")
        pins = part.get("pins") or {}
        if pins:
            out.append("- **pins → nets:** " + ", ".join(f"`{k}` → `{v}`" for k, v in pins.items()))
        if part.get("nets"):
            out.append("- **pads → nets:** " + ", ".join(f"{i + 1} → `{n}`" for i, n in enumerate(part["nets"])))
        if part.get("near"):
            out.append(f"- **placed near:** `{part['near']}`")
    return "\n".join(out) + "\n"


# --- Parts as packages: a pick → an LCSC number, locked -----------------------


def norm(text: str) -> str:
    """One spelling for what catalogues spell many ways: Ω/ohm, µ/μ/u, case."""
    t = text.lower().replace("µ", "u").replace("μ", "u").replace("ohms", "ω").replace("ohm", "ω")
    return re.sub(r"\s+", " ", t)


def value_token(v: str) -> str:
    """`4k7` → `4.7k`, `10kΩ` → `10k`, `100nF` → `100n`: the value without its unit."""
    v = norm(v).replace(" ", "")
    m = re.fullmatch(r"(\d+)([pnumkr])(\d+)([ωfh]?)", v)
    if m:
        v = f"{m.group(1)}.{m.group(3)}{'' if m.group(2) == 'r' else m.group(2)}"
    v = v.rstrip("ωfh")
    return v[:-1] if re.fullmatch(r"[\d.]+r", v) else v


def has_value(description: str, value: str) -> bool:
    want = value_token(value)
    return any(value_token(tok) == want for tok in re.split(r"[\s,;/()]+", norm(description)) if tok)


def has_words(description: str, words: str) -> bool:
    """`words` in the description as whole tokens: "1%" is not in "±0.1%"."""
    return re.search(r"(?<![\w.])" + re.escape(norm(words)) + r"(?!\w)", norm(description)) is not None


def price_at(price: str, qty: int) -> float | None:
    """The unit price at `qty`, from jlcparts' JSON tiers or JLCPCB's `1-9:0.01,10-:0.008`."""
    tiers: list[tuple[int, float]] = []
    try:
        for t in json.loads(price or "[]"):
            tiers.append((int(t.get("qFrom") or 1), float(t["price"])))
    except (ValueError, TypeError, KeyError, AttributeError):
        for t in (price or "").split(","):
            m = re.match(r"\s*(\d+)\s*-\s*\d*\s*:\s*([\d.]+)", t)
            if m:
                tiers.append((int(m.group(1)), float(m.group(2))))
    best = None
    for q, p in sorted(tiers):
        if q <= max(qty, 1) or best is None:
            best = p
    return best


def col(row: dict, *names: str) -> str:
    for n in names:
        if n in row and row[n] not in (None, ""):
            return str(row[n])
    return ""


def item(row: dict) -> dict:
    """A catalogue row, whichever export it came from, in one shape."""
    lcsc = col(row, "lcsc", "LCSC Part", "LCSC")
    flags = {col(row, k).lower() for k in ("library_type", "Library Type", "Component Library Type")}
    tier = (
        "basic" if col(row, "basic").lower() in ("1", "true") or flags & {"base", "basic"}
        else "preferred" if col(row, "preferred").lower() in ("1", "true") or "preferred" in flags
        else "extended"
    )
    return {
        "lcsc": lcsc if lcsc.upper().startswith("C") else f"C{lcsc}",
        "mpn": col(row, "mfr", "MFR.Part", "mpn"),
        "manufacturer": col(row, "manufacturer", "Manufacturer"),
        "package": col(row, "package", "Package"),
        "category": " / ".join(x for x in (col(row, "category", "First Category"), col(row, "subcategory", "Second Category")) if x),
        "description": col(row, "description", "Description"),
        "stock": int(float(col(row, "stock", "Stock") or 0)),
        "price": col(row, "price", "Price"),
        "tier": tier,
    }


def catalogue_path(given: str | None) -> Path:
    given = given or os.environ.get("FID_PARTS_CATALOGUE")
    if given:
        return Path(given)
    cache = Path(os.environ.get("XDG_CACHE_HOME", Path.home() / ".cache")) / "fiducial" / "jlcpcb-basic-preferred.csv"
    if not cache.exists():
        print(f"downloading the parts catalogue: {CATALOGUE_URL}", file=sys.stderr)
        err = fetch(CATALOGUE_URL, cache)
        if err:
            raise SystemExit(
                f"cannot reach the parts catalogue ({err}). Download {CATALOGUE_URL} by hand and pass "
                "--catalogue <file>, or set FID_PARTS_CATALOGUE."
            )
    return cache


def candidates(cat: Path, pick: dict) -> list[dict]:
    """Every catalogue row the pick could mean, before ranking."""
    if cat.suffix in (".sqlite3", ".sqlite", ".db"):
        con = sqlite3.connect(f"file:{cat}?mode=ro", uri=True)
        con.row_factory = sqlite3.Row
        table = "jlc_components" if con.execute(
            "SELECT 1 FROM sqlite_master WHERE name = 'jlc_components'").fetchone() else "components"
        where, args = [], []
        if pick.get("mpn"):
            where.append("mfr = ?")
            args.append(pick["mpn"])
        if pick.get("package"):
            where.append("package = ? COLLATE NOCASE")
            args.append(pick["package"])
        sql = f"SELECT * FROM {table}" + (" WHERE " + " AND ".join(where) if where else "")
        rows = [dict(r) for r in con.execute(sql, args)]
        con.close()
    else:
        with cat.open(newline="", encoding="utf-8") as f:
            rows = list(csv.DictReader(f))
    return [item(r) for r in rows]


def matches(it: dict, pick: dict) -> bool:
    if pick.get("mpn") and it["mpn"] != pick["mpn"]:
        return False
    if pick.get("package") and it["package"].lower() != pick["package"].lower():
        return False
    if pick.get("category") and norm(pick["category"]) not in norm(it["category"]):
        return False
    if pick.get("value") and not has_value(it["description"], pick["value"]):
        return False
    if not all(has_words(it["description"], h) for h in pick.get("has", [])):
        return False
    return TIERS.index(it["tier"]) <= TIERS.index(pick.get("tier", "basic"))


def pick_problem(pick: dict) -> str | None:
    unknown = set(pick) - set(PICK_KEYS)
    if unknown:
        return f"unknown pick field(s) {sorted(unknown)} — known: {', '.join(PICK_KEYS)}"
    if pick.get("tier", "basic") not in TIERS:
        return f"tier = \"{pick['tier']}\" — one of {', '.join(TIERS)}"
    if not (pick.get("mpn") or pick.get("package")):
        return "a pick names at least a package or an mpn"
    return None


def lcsc_product(code: str) -> dict | None:
    """LCSC's own record of a part number, or None when it has none; raises
    OSError when LCSC cannot be reached."""
    with open_url(LCSC_DETAIL.format(code=code), 30) as r:
        d = (json.load(r) or {}).get("result") or {}
    if not d.get("productCode"):
        return None
    tiers = [(int(t.get("ladder") or 1), float(t.get("usdPrice") or t.get("productPrice")))
             for t in d.get("productPriceList") or [] if (t.get("usdPrice") or t.get("productPrice"))]
    return {
        "mpn": d.get("productModel", ""), "manufacturer": d.get("brandNameEn", ""),
        "package": d.get("encapStandard", ""), "description": d.get("productDescEn", ""),
        "tiers": sorted(tiers), "min_buy": int(d.get("minBuyNumber") or 1),
    }


def unit_cost(tiers: list[tuple[int, float]], min_buy: int, qty: int) -> tuple[float | None, int]:
    """What each unit costs when `qty` are needed: LCSC sells no fewer than its
    minimum (or its first price break), so a 0603 resistor bought for five
    boards is a strip of a hundred, and each of the five carries its share.
    Returns the per-unit cost and how many are bought."""
    if not tiers:
        return None, qty
    buy = max(qty, min_buy, tiers[0][0])
    price = tiers[0][1]
    for ladder, p in tiers:
        if ladder <= buy:
            price = p
    return round(price * buy / qty, 5), buy


def read_lock() -> dict[str, dict]:
    if not LOCK.exists():
        return {}
    return {e["id"]: e for e in tomllib.loads(LOCK.read_text()).get("part", [])}


def toml_value(v) -> str:
    if isinstance(v, bool):
        return "true" if v else "false"
    if isinstance(v, (int, float)):
        return repr(v)
    if isinstance(v, list):
        return "[" + ", ".join(toml_value(x) for x in v) + "]"
    if isinstance(v, dict):
        return "{ " + ", ".join(f"{k} = {toml_value(x)}" for k, x in v.items()) + " }"
    return json.dumps(str(v), ensure_ascii=False)


def write_lock(entries: list[dict]) -> None:
    out = [
        "# Written by `python3 hardware/parts.py resolve` — do not edit.",
        "# Every `pick` in hardware/product.toml, answered: the exact part it resolved to;",
        "# every pinned `lcsc`, as LCSC itself describes it.",
        "# Re-pick with `resolve --update`; a changed pick is re-picked on the next resolve.",
        "version = 1",
    ]
    for e in entries:
        out.append("")
        out.append("[[part]]")
        out += [f"{k} = {toml_value(v)}" for k, v in e.items() if v not in (None, "")]
    LOCK.write_text("\n".join(out) + "\n")


def build_qty(decl: dict, part: dict) -> int:
    return int(part.get("qty", 1)) * int(decl.get("cost", {}).get("quantity", 10))


def resolve(args: list[str]) -> int:
    decl = tomllib.loads(DECL.read_text())
    update = "--update" in args
    given = args[args.index("--catalogue") + 1] if "--catalogue" in args else None
    locked = read_lock()
    entries, problems, cat, today = [], [], None, datetime.date.today().isoformat()
    # Lines that are the same LCSC part are bought together: one strip of 5.1 kΩ
    # for both CC pull-downs, not a minimum order each.
    pooled: dict[str, int] = {}
    for part in decl.get("part", []):
        if part.get("lcsc") and not part.get("pick"):
            pooled[part["lcsc"]] = pooled.get(part["lcsc"], 0) + build_qty(decl, part)
    for part in decl.get("part", []):
        pick = part.get("pick")
        if not pick and part.get("lcsc"):
            # Pinned: confirm the number is a real part, and the one meant —
            # a mistyped C-number orders the wrong part without complaint.
            old = locked.get(part["id"])
            # A lock from before prices were recorded, or bought in another
            # quantity, is verified once more.
            if (old and old.get("lcsc") == part["lcsc"] and not old.get("pick")
                    and old.get("at_qty") == pooled[part["lcsc"]] and not update):
                entries.append(old)
                continue
            try:
                found = lcsc_product(part["lcsc"])
            except (OSError, ValueError) as e:
                print(f"note: {part['id']}: LCSC unreachable, {part['lcsc']} not verified ({e})", file=sys.stderr)
                continue
            if not found:
                problems.append(f"{part['id']}: LCSC has no part {part['lcsc']}")
                continue
            if part.get("mpn") and found["mpn"] and part["mpn"].lower() != found["mpn"].lower():
                problems.append(f"{part['id']}: {part['lcsc']} is {found['mpn']} at LCSC, not the declared mpn {part['mpn']}")
                continue
            qty = pooled[part["lcsc"]]
            price, buy = unit_cost(found.pop("tiers"), found.pop("min_buy"), qty)
            entries.append({"id": part["id"], "lcsc": part["lcsc"], **found, "verified": today, "at_qty": qty,
                            **({"unit_price": price, "currency": "USD", "buy_qty": buy} if price is not None else {})})
            print(f"{part['id']}: {part['lcsc']} is {found['mpn']} ({found['package']}) — verified"
                  + (f", ${price:.4f} each at {qty} with its like (buying {buy})" if price is not None else ""))
            continue
        if not pick:
            continue
        if part.get("lcsc"):
            problems.append(f"{part['id']}: declares both lcsc and pick — a part is pinned or picked, not both")
            continue
        bad = pick_problem(pick)
        if bad:
            problems.append(f"{part['id']}: {bad}")
            continue
        old = locked.get(part["id"])
        if old and old.get("pick") == pick and not update:
            entries.append(old)
            continue
        cat = cat or catalogue_path(given)
        qty = build_qty(decl, part)
        found = [it for it in candidates(cat, pick) if matches(it, pick) and it["stock"] >= qty]
        if not found:
            problems.append(f"{part['id']}: nothing in stock ({qty}+) in {cat.name} matches pick {toml_value(pick)}"
                            + ("" if pick.get("tier") == "extended" else " — try tier = \"extended\" with the full catalogue"))
            continue

        def rank(it: dict):
            p = price_at(it["price"], qty)
            return (TIERS.index(it["tier"]), p if p is not None else float("inf"), -it["stock"], int(it["lcsc"][1:] or 0))

        best = min(found, key=rank)
        price = price_at(best["price"], qty)
        entries.append({
            "id": part["id"], "pick": pick, "lcsc": best["lcsc"], "mpn": best["mpn"],
            "manufacturer": best["manufacturer"], "package": best["package"], "description": best["description"],
            "tier": best["tier"], "stock": best["stock"], "unit_price": price, "currency": "USD" if price is not None else None,
            "at_qty": qty, "candidates": len(found), "resolved": today,
        })
        print(f"{part['id']}: {best['lcsc']} {best['mpn']} ({best['tier']}, {len(found)} candidate(s))")
    write_lock(entries)
    for p in problems:
        print(f"unresolved: {p}", file=sys.stderr)
    picks = sum(1 for e in entries if e.get("pick"))
    print(f"locked {picks} pick(s) and {len(entries) - picks} verified pin(s) in hardware/parts.lock; {len(problems)} unresolved")
    return 1 if problems else 0


def locked_decl(decl: dict) -> dict:
    """The declaration with each pick's answer filled in, as the BOM sees it."""
    locked = read_lock()
    for part in decl.get("part", []):
        e = locked.get(part["id"])
        if part.get("pick") and e and e.get("pick") == part["pick"]:
            for k in ("lcsc", "mpn", "manufacturer"):
                part.setdefault(k, e.get(k))
    return decl


def lock_problems(decl: dict) -> list[str]:
    locked = read_lock()
    return [
        f"{p['id']}: its pick is not answered in hardware/parts.lock — run python3 hardware/parts.py resolve"
        for p in decl.get("part", [])
        if p.get("pick") and (locked.get(p["id"]) or {}).get("pick") != p["pick"]
    ]


def fetch_lcsc(args: list[str]) -> int:
    """An LCSC part's KiCad symbol, footprint and 3D model, through easyeda2kicad."""
    if not args:
        print("usage: parts.py fetch C2040 [C…]", file=sys.stderr)
        return 2
    VENDOR.mkdir(parents=True, exist_ok=True)
    for code in args:
        try:
            # Model paths relative to the project (${KIPRJMOD}): nothing
            # machine-specific is committed. easyeda2kicad wants the output
            # absolute and under the working directory for that.
            subprocess.run(["easyeda2kicad", "--full", f"--lcsc_id={code}", "--output", str(VENDOR / "lcsc"),
                            "--project-relative", "--overwrite"], check=True, cwd=ROOT)
        except FileNotFoundError:
            print("easyeda2kicad is not installed: pip install easyeda2kicad", file=sys.stderr)
            return 1
        except subprocess.CalledProcessError as e:
            print(f"{code}: easyeda2kicad failed ({e.returncode}) — it needs easyeda.com reachable", file=sys.stderr)
            return 1
    # easyeda2kicad writes footprints in KiCad 5's `(module …)` format. A board
    # that embeds one loses its pads' nets and cannot be routed, so KiCad's own
    # converter brings the library to the current format, once, here.
    try:
        subprocess.run(["kicad-cli", "fp", "upgrade", "--force", str(VENDOR / "lcsc.pretty")],
                       check=True, capture_output=True)
    except (FileNotFoundError, subprocess.CalledProcessError) as e:
        print(f"could not upgrade hardware/vendor/lcsc.pretty to the current KiCad format ({e}); "
              "run `kicad-cli fp upgrade --force hardware/vendor/lcsc.pretty`", file=sys.stderr)
        return 1
    footprints = sorted(f.stem for f in (VENDOR / "lcsc.pretty").glob("*.kicad_mod"))
    sym_file = VENDOR / "lcsc.kicad_sym"
    symbols = sorted(set(re.findall(r'^\s*\(symbol "([^"]+?)"', sym_file.read_text(), re.M))) if sym_file.exists() else []
    symbols = [n for n in symbols if not re.search(r"_\d+_\d+$", n)]
    print("vendored into hardware/vendor/lcsc.*; declare a part with these:")
    print("  footprints: " + ", ".join(f'"lcsc:{n}"' for n in footprints))
    print("  symbols:    " + ", ".join(f'"lcsc:{n}"' for n in symbols))
    print("Then add a SOURCES.md line per part (the LCSC number it came from) and run sync.")
    return 0


def sync() -> int:
    decl = locked_decl(tomllib.loads(DECL.read_text()))
    (LIB / "footprints").mkdir(parents=True, exist_ok=True)
    (LIB / "3d").mkdir(parents=True, exist_ok=True)
    before = json.loads((LIB / "manifest.json").read_text()) if (LIB / "manifest.json").exists() else {"parts": {}}
    manifest: dict = {"generated_by": "hardware/parts.py sync — do not edit", "kicad_lib_tag": MODEL_TAG, "parts": {}}
    symbols: list[str] = []
    seen: set[str] = set()
    problems: list[str] = []

    for part in decl.get("part", []):
        entry: dict = {}
        fp_id = part.get("footprint")
        if fp_id:
            lib, name = split_id(fp_id)
            own = VENDOR / f"{lib}.pretty" / f"{name}.kicad_mod"
            src = own if own.exists() else FP_DIR / f"{lib}.pretty" / f"{name}.kicad_mod"
            dest = LIB / "footprints" / f"{name}.kicad_mod"
            # The model the footprint names (easyeda2kicad's differs from the
            # footprint's own name), else one named after the footprint.
            named = re.search(r"\(model\s+\"?[^\"\s)]*?([^/\"\s)]+)\.(?:wrl|step)", own.read_text()) if own.exists() else None
            own_model = VENDOR / f"{lib}.3dshapes" / f"{named.group(1) if named else name}.step"
            if not own_model.exists():
                own_model = VENDOR / f"{lib}.3dshapes" / f"{name}.step"
            if own.exists():
                shutil.copyfile(own, dest)
                entry["footprint"] = {"id": fp_id, "from": str(own.relative_to(ROOT)), "sha256": sha(dest)}
                if own_model.exists():
                    mdest = LIB / "3d" / f"{name}.step"
                    shutil.copyfile(own_model, mdest)
                    entry["model"] = {"from": str(own_model.relative_to(ROOT)), "sha256": sha(mdest), "file": f"3d/{name}.step"}
            elif src.exists():
                shutil.copyfile(src, dest)
                entry["footprint"] = {"id": fp_id, "from": str(src), "sha256": sha(dest)}
                m = re.search(r"\(model\s+\"?\$\{KICAD\d_3DMODEL_DIR\}/([^/\"]+)\.3dshapes/([^\"\s)]+)\.(wrl|step)", src.read_text())
                if m:
                    mdest = LIB / "3d" / f"{m.group(2)}.step"
                    url = MODEL_URL.format(tag=MODEL_TAG, lib=m.group(1), name=m.group(2))
                    err = None if mdest.exists() else fetch(url, mdest)
                    if err:
                        mdest.unlink(missing_ok=True)
                        problems.append(f"{part['id']}: no 3D model at {url} ({err}) — cad.py builds one from the footprint")
                    else:
                        entry["model"] = {"from": url, "sha256": sha(mdest), "file": f"3d/{m.group(2)}.step"}
            elif dest.exists():
                entry["footprint"] = {"id": fp_id, "from": "vendored earlier", "sha256": sha(dest)}
            else:
                problems.append(f"{part['id']}: footprint {fp_id} is not in {FP_DIR} (install kicad-footprints, or set KICAD7_FOOTPRINT_DIR)")
        elif part.get("lcsc") and part.get("place") == "board":
            problems.append(
                f"{part['id']}: no footprint declared; LCSC {part['lcsc']} can be vendored with "
                f"`python3 hardware/parts.py fetch {part['lcsc']}` (easyeda2kicad; needs easyeda.com reachable)"
            )
        sym_id = part.get("symbol")
        if not sym_id and part.get("mount") == "pads" and part.get("nets"):
            # Wire pads are a connector in the schematic: KiCad's generic one.
            sym_id = f"Connector_Generic:Conn_01x{len(part['nets']):02d}"
        if sym_id:
            lib, name = split_id(sym_id)
            own = VENDOR / f"{lib}.kicad_sym"
            src = own if own.exists() and symbol_block(own.read_text(), name) else SYM_DIR / f"{lib}.kicad_sym"
            block = symbol_block(src.read_text(), name) if src.exists() else None
            if block:
                whole = flatten(src.read_text(), block, name)
                if whole is None:
                    problems.append(f"{part['id']}: symbol {sym_id} extends a symbol not in {src.name}")
                block = whole or block
                # One library entry per symbol, however many parts use it;
                # named by the full id, so Device:R and a vendor R never collide.
                if sym_id not in seen:
                    seen.add(sym_id)
                    symbols.append(block.replace(f'(symbol "{name}"', f'(symbol "{sym_id}"', 1))
                entry["symbol"] = {"id": sym_id, "from": str(src.relative_to(ROOT)) if src.is_relative_to(ROOT) else str(src)}
            else:
                problems.append(f"{part['id']}: symbol {sym_id} not found in {src}")
        ds = datasheet(part, problems, (before["parts"].get(part["id"], {}).get("datasheet") or {}))
        if ds:
            entry["datasheet"] = ds
        if entry:
            manifest["parts"][part["id"]] = entry

    # A part no longer declared takes its vendored files with it: a stale
    # footprint in lib/ is a component the product no longer has.
    kept = {f"footprints/{split_id(e['footprint']['id'])[1]}.kicad_mod" for e in manifest["parts"].values() if "footprint" in e}
    kept |= {e["model"]["file"] for e in manifest["parts"].values() if "model" in e}
    kept |= {e["datasheet"][k] for e in manifest["parts"].values() for k in ("file", "text") if e.get("datasheet", {}).get(k)}
    for sub in ("footprints", "3d", "datasheets"):
        if not (LIB / sub).is_dir():
            continue
        for f in (LIB / sub).iterdir():
            if f"{sub}/{f.name}" not in kept:
                f.unlink()
                print(f"removed {f.relative_to(ROOT)} (no longer declared)")
    (LIB / "symbols.kicad_sym").write_text(
        "(kicad_symbol_lib (version 20220914) (generator fid_parts)\n  " + "\n  ".join(symbols) + "\n)\n"
    )
    manifest["problems"] = problems
    (LIB / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
    (LIB / "PARTS.md").write_text(parts_md(decl, manifest))
    for p in problems:
        print(f"unresolved: {p}", file=sys.stderr)
    print(f"vendored {len(manifest['parts'])} part(s) into hardware/lib/; {len(problems)} unresolved")
    return 0


def check() -> int:
    decl = locked_decl(tomllib.loads(DECL.read_text()))
    man = json.loads((LIB / "manifest.json").read_text()) if (LIB / "manifest.json").exists() else {"parts": {}}
    bad = lock_problems(decl)
    for part in decl.get("part", []):
        fp = part.get("footprint")
        if fp:
            got = man["parts"].get(part["id"], {}).get("footprint", {})
            name = split_id(fp)[1]
            f = LIB / "footprints" / f"{name}.kicad_mod"
            if got.get("id") != fp or not f.exists() or sha(f) != got.get("sha256"):
                bad.append(f"{part['id']}: {fp} is not vendored as declared — run python3 hardware/parts.py sync")
        ds = man["parts"].get(part["id"], {}).get("datasheet") or {}
        if ds.get("file"):
            f = LIB / ds["file"]
            if not f.exists() or sha(f) != ds.get("sha256"):
                bad.append(f"{part['id']}: datasheet {ds['file']} does not match the manifest — run python3 hardware/parts.py sync")
        elif part.get("datasheet") and ds.get("url") != part["datasheet"]:
            bad.append(f"{part['id']}: datasheet {part['datasheet']} is declared but not synced — run python3 hardware/parts.py sync")
    if (LIB / "PARTS.md").read_text() != parts_md(decl, man) if (LIB / "PARTS.md").exists() else True:
        bad.append("hardware/lib/PARTS.md is stale — run python3 hardware/parts.py sync")
    missing = [p for p in man.get("problems", []) if "datasheet" in p]
    for m in missing:
        print(f"note: {m}", file=sys.stderr)
    for b in bad:
        print(b, file=sys.stderr)
    return 1 if bad else 0


if __name__ == "__main__":
    cmd, rest = (sys.argv[1], sys.argv[2:]) if len(sys.argv) > 1 else ("sync", [])
    commands = {"sync": lambda: sync(), "check": lambda: check(), "resolve": lambda: resolve(rest), "fetch": lambda: fetch_lcsc(rest)}
    sys.exit(commands.get(cmd, lambda: (print(__doc__), 2)[1])())
'''

