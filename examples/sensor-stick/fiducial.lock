base_content = '''
#!/usr/bin/python3
"""hardware/generated/board.kicad_pcb → a routed, poured, DRC-checked board.

    /usr/bin/python3 hardware/route.py

Platform-owned (installed by `fid add capability hardware`). Runs with the
Python KiCad's own `pcbnew` module is built for — the system one, hence the
shebang — not a virtualenv.

fid-hardware derives the board with every part placed and every pad on its
net, and stops there: routing is a search, not a derivation. This does it:

1. design rules: `board.track_mm` (0.2) tracks, `board.clearance_mm` (0.15), 0.5/0.25 mm vias, and wider
   tracks on the nets that carry current (GND and `board.power_nets`);
2. the board out to Specctra DSN, routed by Freerouting (pinned, fetched once
   into hardware/build/tools/ and checked by hash), and read back;
3. a ground pour on both layers, filled;
4. KiCad's own DRC.

With `board.routing = "hand"` it routes nothing: the product's own
hardware/board-routed.kicad_pcb, which `fid derive` has checked against the
declaration, gets the same rules, zone fill and DRC.

It writes hardware/build/board-routed.kicad_pcb (open it in KiCad — this is
the board to fabricate), route.json (the verdict, with the placed board's
and the routed copper's hashes: Freerouting is not deterministic, so a
re-route of the same placement can differ, and this shows it), and copper.json (tracks,
vias, pours and pads, for the review renders). It fails when a net is left
unrouted or DRC finds an error: a board that is not connected is not a board.
"""

from __future__ import annotations

import hashlib
import json
import math
import re
import subprocess
import sys
import urllib.request
from pathlib import Path

import pcbnew

ROOT = Path(__file__).resolve().parent.parent
SRC = ROOT / "hardware" / "generated" / "board.kicad_pcb"
HAND = ROOT / "hardware" / "board-routed.kicad_pcb"  # board.routing = "hand"
BUILD = ROOT / "hardware" / "build"
TOOLS = BUILD / "tools"
FREEROUTING = "2.1.0"
FREEROUTING_URL = f"https://github.com/freerouting/freerouting/releases/download/v{FREEROUTING}/freerouting-{FREEROUTING}.jar"
FREEROUTING_SHA256 = None  # filled on first fetch into tools/freerouting.sha256; see fetch()
MM = pcbnew.FromMM
# Nets that carry current get wider copper: GND, and whatever the product
# names in `board.power_nets` (each a net name or a prefix ending in `*`).
POWER_WIDTH = 0.3
ATTEMPTS = 4  # fresh routing runs before an open connection is the verdict
HOLE_CLEARANCE = 0.2


def board_decl() -> dict:
    import tomllib

    return tomllib.loads((ROOT / "hardware" / "product.toml").read_text()).get("board", {})


def power_nets() -> list[str]:
    return ["GND"] + list(board_decl().get("power_nets", []))


def fetch() -> Path:
    """Freerouting, once: downloaded, hashed, and the hash kept beside it so a
    swapped jar is caught on the next run."""
    TOOLS.mkdir(parents=True, exist_ok=True)
    jar = TOOLS / f"freerouting-{FREEROUTING}.jar"
    pin = TOOLS / f"freerouting-{FREEROUTING}.sha256"
    if not jar.exists():
        with urllib.request.urlopen(FREEROUTING_URL, timeout=120) as r:
            jar.write_bytes(r.read())
    digest = hashlib.sha256(jar.read_bytes()).hexdigest()
    if pin.exists() and pin.read_text().strip() != digest:
        raise SystemExit(f"{jar} does not match its recorded hash — delete tools/ to refetch")
    pin.write_text(digest + "\n")
    return jar


def rules(board: pcbnew.BOARD) -> None:
    # `board.track_mm` and `board.clearance_mm`: 0.2 / 0.15 by default. A
    # 1.27 mm-pitch test pad array (Tag-Connect) or a 0.5 mm QFN escapes only
    # at 0.15 / 0.127 — JLCPCB's standard 2-layer process holds 0.127 / 0.127.
    decl = board_decl()
    track, clear = float(decl.get("track_mm", 0.2)), float(decl.get("clearance_mm", 0.15))
    ds = board.GetDesignSettings()
    ds.m_TrackMinWidth = MM(min(track, 0.15))
    ds.m_MinClearance = MM(clear)
    # Copper to a non-plated hole's edge: 0.2 mm, JLCPCB's standard.
    ds.m_HoleClearance = MM(HOLE_CLEARANCE)
    # Fine-pitch QFN pads sit closer than any mask web a fab can hold;
    # JLCPCB gangs them, so a bridged mask between them is not an error.
    ds.m_SolderMaskMinWidth = 0
    # Vias: 0.5 mm on a 0.25 mm drill, inside JLCPCB's standard 2-layer
    # capability (0.2 mm drill, 0.45 mm via) — small enough to escape a QFN.
    ds.m_MinThroughDrill = MM(0.25)
    ds.m_ViasMinSize = MM(0.5)
    nc = ds.m_NetSettings.m_DefaultNetClass
    nc.SetTrackWidth(MM(track))
    nc.SetClearance(MM(clear))
    nc.SetViaDiameter(MM(0.5))
    nc.SetViaDrill(MM(0.25))
    power = pcbnew.NETCLASS("Power")
    power.SetTrackWidth(MM(POWER_WIDTH))
    power.SetClearance(MM(max(clear, 0.15)))
    power.SetViaDiameter(MM(0.6))
    power.SetViaDrill(MM(0.3))
    ds.m_NetSettings.m_NetClasses["Power"] = power
    for name, net in board.GetNetsByName().items():
        n = str(name)
        if n and any(n == p or (p.endswith("*") and n.startswith(p[:-1])) for p in power_nets()):
            net.SetNetClass(power)


def route(board: pcbnew.BOARD) -> None:
    """Route; while a connection is left open, route again from scratch, and
    keep the best. Freerouting does not give the same answer twice on a dense
    fine-pitch board, so one run that leaves a pad open is not the verdict."""
    # Freerouting keeps only its track clearance from the board edge; KiCad's
    # rule is the edge clearance. A no-track strip of that width, inside the
    # edge, makes the router honour it; it is removed once routing is done.
    # Four plain strips, not one frame with a hole: Freerouting 2.1's maze
    # search fails on a keep-out with a window (NullPointerException, and a
    # third of the connections left open on the same board).
    # One strip per edge of the board's real outline — four for a rectangle,
    # more for a board cut to its case (board.cut_mm) — each straddling its
    # edge, so the inner half keeps tracks off it.
    edge = MM(0.5)
    outline = pcbnew.SHAPE_POLY_SET()
    board.GetBoardPolygonOutlines(outline)
    ring = outline.Outline(0)
    pts = [(ring.CPoint(k).x, ring.CPoint(k).y) for k in range(ring.PointCount())]
    strips = []
    for k in range(len(pts)):
        (ax, ay), (bx, by) = pts[k], pts[(k + 1) % len(pts)]
        length = math.hypot(bx - ax, by - ay)
        if length < 1:
            continue
        nx, ny = -(by - ay) / length * edge, (bx - ax) / length * edge
        quad = [(ax + nx, ay + ny), (bx + nx, by + ny), (bx - nx, by - ny), (ax - nx, ay - ny)]
        strip = pcbnew.ZONE(board)
        strip.SetIsRuleArea(True)
        strip.SetDoNotAllowTracks(True)
        strip.SetDoNotAllowVias(True)
        strip.SetDoNotAllowCopperPour(False)
        strip.SetDoNotAllowPads(False)
        strip.SetDoNotAllowFootprints(False)
        strip.SetLayerSet(pcbnew.LSET.AllCuMask())
        o = strip.Outline()
        o.NewOutline()
        for x, y in quad:
            o.Append(int(round(x)), int(round(y)))
        board.Add(strip)
        strips.append(strip)
    best: tuple[int, str] | None = None
    try:
        for attempt in range(ATTEMPTS):
            if attempt:
                for t in list(board.GetTracks()):
                    board.Remove(t)
            session = route_once(board)
            n = open_connections(board)
            print(f"route attempt {attempt + 1}: {n} connection(s) open")
            if best is None or n < best[0]:
                best = (n, session)
            if n == 0:
                return
        read_session(board, best[1])
    finally:
        for strip in strips:
            board.Remove(strip)


def open_connections(board: pcbnew.BOARD) -> int:
    board.BuildConnectivity()
    return board.GetConnectivity().GetUnconnectedCount(False)


def route_once(board: pcbnew.BOARD) -> str:
    dsn, ses = BUILD / "board.dsn", BUILD / "board.ses"
    ses.unlink(missing_ok=True)
    if not pcbnew.ExportSpecctraDSN(board, str(dsn)):
        raise SystemExit("KiCad could not export the board to Specctra DSN")
    unpad_holes(dsn, board)
    margin_clearances(dsn)
    jar = fetch()
    # Headless, no usage analytics, and a time budget per attempt.
    #
    # Fan-out first: a short escape from every SMD pad before the maze search.
    # Without it, a 0.4 mm-pitch QFN beside its flash left one to four
    # connections open in about half of all runs — the example's CI failed
    # whenever four attempts in a row did. With it, eight runs of eight routed
    # completely, in a quarter of the time.
    cmd = ["java", "-Djava.awt.headless=true", "-jar", str(jar), "--gui.enabled=false",
           "--usage_and_diagnostic_data.disable_analytics=true", "--router.fanout.enabled=true",
           "--router.optimizer.enabled=false", "--router.max_passes=200", "--router.job_timeout=00:02:00",
           "-de", str(dsn), "-do", str(ses), "-mt", "1"]
    p = subprocess.run(cmd, capture_output=True, text=True, timeout=900)
    (BUILD / "freerouting.log").write_text(p.stdout + p.stderr)
    if not ses.exists() or ses.stat().st_size == 0:
        raise SystemExit(f"Freerouting wrote no session; see {BUILD / 'freerouting.log'}")
    text = ses.read_text()
    read_session(board, text)
    return text


def margin_clearances(dsn: Path) -> None:
    """Freerouting routes at the clearance exactly, and its read-back can land
    a hair under it: one route in four of the same placement once came back
    with a track 0.1252 mm from a pad, against a 0.127 mm rule, and failed
    DRC. The router gets 10 µm more than the rule; KiCad's DRC checks the
    rule itself."""
    text = dsn.read_text()
    if "(unit um)" not in text and "(resolution um" not in text:
        return
    bump = lambda m: f"(clearance {float(m.group(1)) + 10:.1f}" if float(m.group(1)) >= 100 else m.group(0)  # noqa: E731
    dsn.write_text(re.sub(r"\(clearance ([\d.]+)", bump, text))


def unpad_holes(dsn: Path, board: pcbnew.BOARD) -> None:
    """KiCad exports a non-plated hole as a keep-out of the drill plus the hole
    clearance, and Freerouting then keeps its own track clearance from that —
    the margin counted twice. Between a Tag-Connect's leg holes that closes a
    0.8 mm gap a 0.15 mm track fits with room to spare. Take the router's
    clearance back off each hole keep-out; KiCad's DRC still checks the real one."""
    text = dsn.read_text()
    if "(unit um)" not in text and "(resolution um" not in text:
        return
    clear_um = pcbnew.ToMM(board.GetDesignSettings().m_NetSettings.m_DefaultNetClass.GetClearance()) * 1000
    shrink = lambda m: f'(keepout "" (circle {m.group(1)} {max(float(m.group(2)) - 2 * clear_um, 1):.1f}'  # noqa: E731
    dsn.write_text(re.sub(r'\(keepout "" \(circle (\S+) ([\d.]+)', shrink, text))


def sexpr(text: str):
    """A Specctra file as nested lists of atoms."""
    stack, cur, tok, quoted = [], [], "", False
    for ch in text:
        if quoted:
            if ch == '"':
                quoted = False
                cur.append(tok)
                tok = ""
            else:
                tok += ch
        elif ch == '"':
            quoted = True
        elif ch in "() \t\r\n":
            if tok:
                cur.append(tok)
                tok = ""
            if ch == "(":
                stack.append(cur)
                cur = []
            elif ch == ")":
                done, cur = cur, stack.pop()
                cur.append(done)
        else:
            tok += ch
    return cur[0]


def read_session(board: pcbnew.BOARD, text: str) -> None:
    """Freerouting's session (.ses) → tracks and vias on the board.

    KiCad 7's ImportSpecctraSES works only inside the editor, so the session
    is read here: each `wire` path is a run of tracks on its layer, each `via`
    a via whose padstack name carries its diameter and drill (µm).
    """
    tree = sexpr(text)
    routes = next(x for x in tree if isinstance(x, list) and x and x[0] == "routes")
    # The session holds the whole routing, earlier passes included.
    for t in list(board.GetTracks()):
        board.Remove(t)
    res = next(x for x in routes if isinstance(x, list) and x and x[0] == "resolution")
    per_mm = {"um": 1000.0, "mm": 1.0, "mil": 1000 / 25.4}[res[1]] * float(res[2])
    # The DSN KiCad wrote has y pointing up.
    to = lambda x, y: pcbnew.VECTOR2I(MM(float(x) / per_mm), MM(-float(y) / per_mm))
    layers = {board.GetLayerName(l): l for l in (pcbnew.F_Cu, pcbnew.B_Cu)}
    net_out = next(x for x in routes if isinstance(x, list) and x and x[0] == "network_out")
    for net in net_out[1:]:
        code = board.FindNet(net[1])
        for item in net[2:]:
            if item[0] == "wire":
                path = next(x for x in item[1:] if isinstance(x, list) and x[0] == "path")
                layer, width, pts = path[1], float(path[2]) / per_mm, path[3:]
                xy = [to(pts[i], pts[i + 1]) for i in range(0, len(pts) - 1, 2)]
                for a, b in zip(xy, xy[1:]):
                    t = pcbnew.PCB_TRACK(board)
                    t.SetStart(a)
                    t.SetEnd(b)
                    t.SetWidth(MM(width))
                    t.SetLayer(layers[layer])
                    t.SetNet(code)
                    board.Add(t)
            elif item[0] == "via":
                dims = item[1].split("_")[-2].split(":")
                v = pcbnew.PCB_VIA(board)
                v.SetPosition(to(item[2], item[3]))
                v.SetWidth(MM(float(dims[0]) / 1000))
                v.SetDrill(MM(float(dims[1]) / 1000))
                v.SetViaType(pcbnew.VIATYPE_THROUGH)
                v.SetLayerPair(pcbnew.F_Cu, pcbnew.B_Cu)
                v.SetNet(code)
                board.Add(v)


def pour(board: pcbnew.BOARD) -> None:
    gnd = board.FindNet("GND")
    if gnd is None:
        return
    box = board.GetBoardEdgesBoundingBox()
    for layer in (pcbnew.F_Cu, pcbnew.B_Cu):
        z = pcbnew.ZONE(board)
        z.SetLayer(layer)
        z.SetNet(gnd)
        z.SetZoneName(f"GND-{board.GetLayerName(layer)}")
        z.SetLocalClearance(MM(0.3))
        z.SetMinThickness(MM(0.25))
        z.SetPadConnection(pcbnew.ZONE_CONNECTION_FULL)  # reflowed, not hand-soldered
        z.SetThermalReliefGap(MM(0.3))
        z.SetThermalReliefSpokeWidth(MM(0.4))
        z.SetAssignedPriority(0)
        # Copper that touches no ground pad or track is an antenna, not a
        # ground: drop those islands rather than leave them floating.
        z.SetIslandRemovalMode(pcbnew.ISLAND_REMOVAL_MODE_ALWAYS)
        o = z.Outline()
        o.NewOutline()
        for x, y in ((box.GetLeft(), box.GetTop()), (box.GetRight(), box.GetTop()),
                     (box.GetRight(), box.GetBottom()), (box.GetLeft(), box.GetBottom())):
            o.Append(x, y)
        board.Add(z)
    pcbnew.ZONE_FILLER(board).Fill(board.Zones())


def drc(board: pcbnew.BOARD, path: Path) -> dict:
    pcbnew.WriteDRCReport(board, str(path), pcbnew.EDA_UNITS_MILLIMETRES, True)
    # Each item: `[kind]: message`, then `Rule…; Severity: error|warning`.
    errors: dict[str, int] = {}
    warnings: dict[str, int] = {}
    # Items are blocks: `[kind]: message`, a rule line with the severity,
    # then the `@(x, y): what` lines it involves.
    blocks: list[list[str]] = []
    for line in path.read_text().splitlines():
        if line.startswith("["):
            blocks.append([line])
        elif blocks and line.startswith("    "):
            blocks[-1].append(line)
    for b in blocks:
        kind = b[0][1:b[0].index("]")]
        severity = next((l for l in b if "Severity:" in l), "")
        # Library-link notices say the footprint differs from a library
        # this board was never linked to: true of every derived board.
        if kind == "lib_footprint_issues" or not severity:
            continue
        error = "Severity: error" in severity
        # A footprint's own mask opening (a graphic on F.Mask, not a pad) over
        # copper is the footprint's design — U.FL ground — not a bridge.
        if kind == "solder_mask_bridge" and any("Rect on F.Mask" in l or "Polygon on F.Mask" in l for l in b):
            error = False
        bucket = errors if error else warnings
        bucket[kind] = bucket.get(kind, 0) + 1
    return {
        "violations": sum(v for k, v in errors.items() if k != "unconnected_items"),
        "unconnected": errors.get("unconnected_items", 0),
        "errors": errors,
        "warnings": warnings,
        "report": str(path.relative_to(ROOT)),
    }


def routed_hash(board: pcbnew.BOARD) -> str:
    """The routed copper — tracks and vias, to the micrometre, in a fixed
    order — hashed. The board file itself carries UUIDs and a fill, so its
    bytes would differ on an identical route."""
    um = lambda v: round(pcbnew.ToMM(v), 3)
    items = []
    for t in board.GetTracks():
        if t.GetClass() == "PCB_VIA":
            items.append(("via", um(t.GetPosition().x), um(t.GetPosition().y), um(t.GetWidth()), t.GetNetname()))
        else:
            a, b = sorted([(um(t.GetStart().x), um(t.GetStart().y)), (um(t.GetEnd().x), um(t.GetEnd().y))])
            items.append(("track", board.GetLayerName(t.GetLayer()), *a, *b, um(t.GetWidth()), t.GetNetname()))
    return hashlib.sha256(json.dumps(sorted(items, key=str)).encode()).hexdigest()


def copper(board: pcbnew.BOARD) -> dict:
    """Everything copper, in KiCad board coordinates (mm, y down)."""
    mm = pcbnew.ToMM
    out = {"tracks": [], "vias": [], "pours": [], "pads": [], "refs": []}
    for t in board.GetTracks():
        if t.GetClass() == "PCB_VIA":
            out["vias"].append({"at": [mm(t.GetPosition().x), mm(t.GetPosition().y)],
                                "d": mm(t.GetWidth()), "drill": mm(t.GetDrillValue())})
        else:
            out["tracks"].append({"layer": board.GetLayerName(t.GetLayer()),
                                  "a": [mm(t.GetStart().x), mm(t.GetStart().y)],
                                  "b": [mm(t.GetEnd().x), mm(t.GetEnd().y)],
                                  "w": mm(t.GetWidth()), "net": t.GetNetname()})
    for z in board.Zones():
        if z.GetIsRuleArea():
            continue
        for layer in (pcbnew.F_Cu, pcbnew.B_Cu):
            if not z.IsOnLayer(layer):
                continue
            polys = z.GetFilledPolysList(layer)
            for i in range(polys.OutlineCount()):
                ring = polys.Outline(i)
                holes = [[[mm(h.CPoint(k).x), mm(h.CPoint(k).y)] for k in range(h.PointCount())]
                         for h in (polys.Hole(i, j) for j in range(polys.HoleCount(i)))]
                out["pours"].append({"layer": board.GetLayerName(layer),
                                     "outline": [[mm(ring.CPoint(k).x), mm(ring.CPoint(k).y)] for k in range(ring.PointCount())],
                                     "holes": holes})
    for fp in board.GetFootprints():
        p = fp.GetPosition()
        out["refs"].append({"ref": fp.GetReference(), "at": [mm(p.x), mm(p.y)], "rot": fp.GetOrientationDegrees(),
                            "layer": board.GetLayerName(fp.GetLayer())})
        for pad in fp.Pads():
            q = pad.GetPosition()
            out["pads"].append({"at": [mm(q.x), mm(q.y)], "size": [mm(pad.GetSize().x), mm(pad.GetSize().y)],
                                "rot": pad.GetOrientationDegrees(),
                                "shape": "circle" if pad.GetShape() == pcbnew.PAD_SHAPE_CIRCLE else "rect",
                                "drill": mm(pad.GetDrillSize().x),
                                "layers": [n for n in ("F.Cu", "B.Cu") if pad.IsOnLayer(board.GetLayerID(n))],
                                "net": pad.GetNetname()})
    return out


def main() -> int:
    BUILD.mkdir(parents=True, exist_ok=True)
    # `board.routing = "hand"`: a person routed it in KiCad, and `fid derive`
    # has already refused it unless its parts, nets and outline are still the
    # declaration's. Nothing to route; the same rules and DRC decide it.
    hand = board_decl().get("routing", "auto") == "hand"
    if hand:
        if not HAND.exists():
            raise SystemExit(f"board.routing = \"hand\" and there is no {HAND.relative_to(ROOT)}")
        board = pcbnew.LoadBoard(str(HAND))
        rules(board)
    else:
        board = pcbnew.LoadBoard(str(SRC))
        rules(board)
        route(board)
        pour(board)
    out = BUILD / "board-routed.kicad_pcb"
    board.Save(str(out))
    board = pcbnew.LoadBoard(str(out))
    pcbnew.ZONE_FILLER(board).Fill(board.Zones())
    verdict = drc(board, BUILD / "drc.rpt")
    verdict["tracks"] = sum(1 for t in board.GetTracks() if t.GetClass() != "PCB_VIA")
    verdict["vias"] = sum(1 for t in board.GetTracks() if t.GetClass() == "PCB_VIA")
    verdict["router"] = f"by hand ({HAND.relative_to(ROOT)})" if hand else f"Freerouting {FREEROUTING}"
    # Placement is deterministic; Freerouting is not. The placed board's hash
    # and the routed copper's, side by side, make a different route visible:
    # same `placed`, different `routed` is the router, not the design.
    verdict["placed_sha256"] = hashlib.sha256(SRC.read_bytes()).hexdigest()
    verdict["routed_sha256"] = routed_hash(board)
    board.Save(str(out))
    (BUILD / "route.json").write_text(json.dumps(verdict, indent=2) + "\n")
    (BUILD / "copper.json").write_text(json.dumps(copper(board)) + "\n")
    ok = verdict["unconnected"] == 0 and verdict["violations"] == 0
    print(f"routed: {verdict['tracks']} tracks, {verdict['vias']} vias "
          f"(copper {verdict['routed_sha256'][:12]}); "
          f"DRC {verdict['violations']} violation(s), {verdict['unconnected']} unconnected"
          + ("" if ok else f" — see {verdict['report']}"))
    return 0 if ok else 1


if __name__ == "__main__":
    sys.exit(main())
'''

[templates."hardware/viewer.html"]
source_version = "0.9.0"
hash = "d4b03d05d687f317342bc1becef8e1fcdf1cb1e6cacc720ed4012ab847eb6a0d"
base_content = """
<!doctype html>
<!--
  The hardware viewer. Platform-owned: installed by `fid add capability hardware`.

  Opened by hardware/render.mjs to take the review-pack pictures, and written
  by it, with every mesh inlined, as hardware/build/review/viewer.html — one
  file you can open anywhere, orbit, explode and section.

  Query: ?view=assembled|exploded|section|inside  &shot=1 (fixed camera, no UI)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardware viewer</title>
<style>
  :root { --bg: #f3efe9; --ink: #1d1a17; --muted: #6d655c; --card: rgba(255,255,255,.82); --line: #d8d0c6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16130f; --ink: #f1ece6; --muted: #a39a8f; --card: rgba(30,26,22,.82); --line: #3a332c; } }
  :root[data-theme="dark"] { --bg: #16130f; --ink: #f1ece6; --muted: #a39a8f; --card: rgba(30,26,22,.82); --line: #3a332c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .card { position: absolute; background: var(--card); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  #title { top: 16px; left: 16px; max-width: min(420px, calc(100vw - 64px)); }
  #title h1 { margin: 0 0 2px; font-size: 16px; } #title p { margin: 0; color: var(--muted); font-size: 12px; }
  #legend { bottom: 16px; left: 16px; font-size: 12px; display: grid; grid-template-columns: repeat(2, auto); gap: 4px 14px; }
  #legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
  #checks { top: 16px; right: 16px; font-size: 12px; }
  #checks b.ok { color: #2e8b57; } #checks b.bad { color: #c0392b; }
  #ui { bottom: 16px; right: 16px; display: flex; gap: 6px; flex-wrap: wrap; }
  #ui button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  #ui button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  body.shot #ui { display: none; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
</head>
<body>
<div id="title" class="card"><h1 id="name">…</h1><p id="sub"></p></div>
<div id="checks" class="card"></div>
<div id="legend" class="card"></div>
<div id="ui" class="card">
  <button data-view="assembled">Assembled</button>
  <button data-view="exploded">Exploded</button>
  <button data-view="section">Section</button>
  <button data-view="inside">Inside</button>
  <button data-view="underside">Underside</button>
  <button data-view="board">Board</button>
</div>
<script type="module">
import * as THREE from "three";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const shot = q.get("shot") === "1";
if (shot) document.body.classList.add("shot");

// Inlined by render.mjs for the standalone viewer; fetched otherwise.
const scene = window.__SCENE__ ?? await (await fetch("scene.json")).json();
const checks = window.__CHECKS__ ?? await fetch("checks.json").then(r => r.json()).catch(() => null);
const loadStl = async (name) => {
  if (window.__STL__) { const b = atob(window.__STL__[name]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; }
  return (await fetch(name)).arrayBuffer();
};

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(shot ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.localClippingEnabled = true;
document.body.prepend(renderer.domElement);

const world = new THREE.Scene();
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
world.background = new THREE.Color(dark ? 0x16130f : 0xf3efe9);
world.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
world.add(new THREE.HemisphereLight(0xffffff, 0x8a7a6a, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
sun.shadow.radius = 6;
world.add(sun, sun.target);

// CAD is z-up in millimetres; three is y-up.
const root = new THREE.Group();
root.rotation.x = -Math.PI / 2;
world.add(root);

const clip = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);
const meshes = [];
const loader = new STLLoader();
for (const p of scene.parts) {
  const geo = loader.parse(await loadStl(p.stl));
  geo.computeVertexNormals();
  const [color, metalness, roughness, opacity] = scene.looks[p.look] ?? ["#888888", 0, 0.6, 1];
  const mat = new THREE.MeshStandardMaterial({ color, metalness, roughness, transparent: opacity < 1, opacity, side: THREE.DoubleSide, clipShadows: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = mesh.receiveShadow = true;
  const g = new THREE.Group(); g.add(mesh); g.userData = p;
  // A manufacturer's model is already detailed; outlines would only add noise.
  if (!p.look.startsWith("#")) g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 28), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28 })));
  root.add(g); meshes.push(g);
}

// The routed board's copper, from KiCad's own geometry (route.py → copper.json):
// pours and tracks under green solder mask, pads exposed in ENIG gold, vias.
if (scene.copper) {
  const cu = scene.copper;
  const [ox, oy] = cu.origin;
  const P = ([x, y]) => new THREE.Vector2(x + ox, oy - y);   // KiCad (y down) → case (y up)
  const mats = {
    pour: new THREE.MeshStandardMaterial({ color: "#145c31", roughness: 0.42, metalness: 0.05 }),
    track: new THREE.MeshStandardMaterial({ color: "#1f7a42", roughness: 0.38, metalness: 0.1 }),
    pad: new THREE.MeshStandardMaterial({ color: "#d9b25a", roughness: 0.28, metalness: 0.9 }),
    via: new THREE.MeshStandardMaterial({ color: "#1f7a42", roughness: 0.38, metalness: 0.1 }),
    hole: new THREE.MeshBasicMaterial({ color: "#151515" }),
  };
  const group = new THREE.Group();
  const flat = (shape, mat, z) => { const m = new THREE.Mesh(new THREE.ShapeGeometry(shape, 8), mat); m.position.z = z; m.receiveShadow = true; group.add(m); };
  for (const side of ["F.Cu", "B.Cu"]) {
    const top = side === "F.Cu";
    // Just off the board's face, in drawing order: pour, track, pad.
    const z = (k) => top ? cu.z_top + 0.01 * k : cu.z_bottom - 0.01 * k;
    for (const p of cu.pours.filter(p => p.layer === side)) {
      const s = new THREE.Shape(p.outline.map(P));
      s.holes = p.holes.map(h => new THREE.Path(h.map(P)));
      flat(s, mats.pour, z(1));
    }
    for (const t of cu.tracks.filter(t => t.layer === side)) {
      const a = P(t.a), b = P(t.b), d = b.clone().sub(a), len = d.length(), r = t.w / 2;
      const s = new THREE.Shape();
      if (len > 1e-6) {
        const n = new THREE.Vector2(-d.y, d.x).normalize().multiplyScalar(r), ang = Math.atan2(d.y, d.x);
        s.moveTo(a.x + n.x, a.y + n.y); s.lineTo(b.x + n.x, b.y + n.y);
        s.absarc(b.x, b.y, r, ang + Math.PI / 2, ang - Math.PI / 2, true);
        s.lineTo(a.x - n.x, a.y - n.y);
        s.absarc(a.x, a.y, r, ang - Math.PI / 2, ang + Math.PI / 2, true);
      } else s.absarc(a.x, a.y, r, 0, Math.PI * 2);
      flat(s, mats.track, z(2));
    }
    for (const p of cu.pads.filter(p => p.layers.includes(side))) {
      const c = P(p.at), [w, h] = p.size, s = new THREE.Shape();
      if (p.shape === "circle") s.absarc(0, 0, w / 2, 0, Math.PI * 2);
      else { s.moveTo(-w / 2, -h / 2); s.lineTo(w / 2, -h / 2); s.lineTo(w / 2, h / 2); s.lineTo(-w / 2, h / 2); }
      const m = new THREE.Mesh(new THREE.ShapeGeometry(s, 12), mats.pad);
      m.position.set(c.x, c.y, z(3)); m.rotation.z = THREE.MathUtils.degToRad(p.rot);
      group.add(m);
    }
    for (const v of cu.vias) {
      const c = P(v.at), ring = new THREE.Shape(); ring.absarc(c.x, c.y, v.d / 2, 0, Math.PI * 2);
      flat(ring, mats.via, z(2));
      const hole = new THREE.Shape(); hole.absarc(c.x, c.y, v.drill / 2, 0, Math.PI * 2);
      flat(hole, mats.hole, z(3));
    }
  }
  group.userData = { group: "board", explode_mm: cu.explode_mm, look: "copper" };
  root.add(group); meshes.push(group);
}

const box = new THREE.Box3().setFromObject(root);
const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
const span = Math.max(size.x, size.y, size.z);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(span * 20, span * 20), new THREE.ShadowMaterial({ opacity: dark ? 0.5 : 0.22 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = box.min.y - 0.01; ground.receiveShadow = true;
world.add(ground);
sun.position.set(centre.x + span * 0.8, centre.y + span * 1.6, centre.z + span * 0.9);
sun.target.position.copy(centre);
const sc = sun.shadow.camera; sc.left = sc.bottom = -span * 1.5; sc.right = sc.top = span * 1.5; sc.far = span * 6; sc.updateProjectionMatrix();

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 1, span * 40);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = !shot;

// Legend, title, checks: derived from scene.json and checks.json.
document.getElementById("name").textContent = scene.product;
document.getElementById("sub").textContent = `${size.x.toFixed(1)} × ${size.z.toFixed(1)} × ${size.y.toFixed(1)} mm · ${new Set(scene.parts.map(p => p.name)).size} parts`;
const used = scene.legend ?? [...new Set(scene.parts.map(p => p.look))];
document.getElementById("legend").innerHTML = used.map(l => `<span style="--c:${scene.looks[l]?.[0] ?? "#888"}">${l}</span>`).join("");
const ck = document.getElementById("checks");
if (checks) {
  const rows = ["interference", "insertion", "lid", "screws", "seal"].map(k => `${k}: <b class="${checks[k]?.length ? "bad" : "ok"}">${checks[k]?.length ? checks[k].length + " failing" : "pass"}</b>`);
  ck.innerHTML = rows.join("<br>");
} else ck.remove();

function setView(v) {
  for (const b of document.querySelectorAll("#ui button")) b.setAttribute("aria-pressed", b.dataset.view === v);
  for (const g of meshes) {
    const p = g.userData;
    g.position.set(0, 0, v === "exploded" ? p.explode_mm : 0);
    // Inside: everything the lid carries is lifted away. Exploded: wires would
    // float disconnected from what they join, so they are left out.
    g.visible = !(((v === "inside" || v === "board") && ["lid", "top", "screws"].includes(p.group)) || (v === "exploded" && p.group === "wires"));
    g.traverse(c => { if (c.material) c.material.clippingPlanes = v === "section" ? [clip] : []; });
  }
  ground.visible = v !== "underside";
  clip.constant = centre.x;
  const lift = v === "exploded" ? 75 : 0;
  const target = centre.clone(); target.y += lift;
  const d = span * (v === "exploded" ? 2.5 : 2.0);
  if (v === "board") {
    // Close on the board: its parts, its copper, the wires that land on it.
    const bb = new THREE.Box3();
    for (const g of meshes) if (g.userData.group === "board") bb.expandByObject(g);
    const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3()), r = Math.max(s.x, s.z);
    camera.position.set(c.x + r * 0.35, c.y + r * 1.25, c.z + r * 0.75);
    controls.target.copy(c); controls.update();
    return;
  }
  if (v === "inside") camera.position.set(centre.x + span * 0.05, centre.y + d * 1.05, centre.z + span * 0.35);
  else if (v === "underside") camera.position.set(centre.x + d * 0.45, centre.y - d * 0.85, centre.z + d * 0.55);
  else if (v === "section") camera.position.set(centre.x + d * 0.9, centre.y + d * 0.3, centre.z + d * 0.5);
  else camera.position.set(centre.x + d * 0.62, centre.y + d * 0.55 + lift * 0.4, centre.z + d * 0.78);
  controls.target.copy(target); controls.update();
}
for (const b of document.querySelectorAll("#ui button")) b.onclick = () => setView(b.dataset.view);
setView(q.get("view") ?? "assembled");
// render.mjs loads the page once and switches views here: parsing every
// mesh again per picture was most of the review pack's time.
window.setView = setView;

addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(world, camera); });
requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; }));
</script>
</body>
</html>
"""

[templates."pipelines/hardware.toml"]
source_version = "0.9.1"
hash = "c720f0541687ccf3b5cfc3ee578f3d164db8bebf56f1a5b7b24ad865da62d107"
base_content = """
name     = "hardware"
executor = "fid-hardware"
args     = ["hardware/product.toml"]
outputs  = [
  "hardware/generated/layout.json",
  "hardware/generated/floor-model.json",
  "hardware/generated/floor.json",
  "hardware/generated/placement-model.json",
  "hardware/generated/placement.json",
  "hardware/generated/bom.csv",
  "hardware/generated/assembly.md",
  "hardware/generated/board.kicad_pcb",
  "hardware/generated/board.kicad_sch",
  "hardware/generated/interface.json",
  "hardware/generated/interface.ts",
  "hardware/generated/board.rs",
]

# hardware/product.toml → the solved product, by output file name:
#
#   layout.json      every position, size and hole, and why — what cad.py builds from
#   floor-model.json the case floor (sockets and the board, inside the cavity)
#                    as a constraint problem, and floor.json its answer
#   placement-model.json  the board placement as a constraint problem (spec 2026-10-01)
#   placement.json   the solver's answer, stamped with the model's hash; reused
#                    while the model is unchanged, so the gate needs no solver
#   bom.csv          declared parts plus what the design implies (screws, gaskets, printed parts)
#   assembly.md      the order it goes together in, derived from each part's mount
#   *.kicad_pcb      the board: outline, holes, real footprints placed, pads on their nets
#   *.kicad_sch      the schematic: every part's KiCad symbol, pins labelled with their nets
#   interface.json   what firmware and web read: board size, sockets, every net and its pins
#   interface.ts     the nets as a TypeScript type, for a web app to import
#   board.rs         with `[firmware] mcu`: a macro per net naming the MCU pin it is on
#                    (`board::sensor_sda!(p)` → `p.PIN_4`) — move a pin and the
#                    firmware follows; rename a net and code using the old name
#                    stops compiling
#
# Inputs are tracked as well as outputs: the declaration and every SVG it
# addresses are hashed into fiducial.lock, so a redrawn logo fails
# `fid derive --check` by name instead of silently disagreeing with the case.
#
# STEP, STL, Gerbers and the review renders come from `hardware/build.sh`.
# They are build products, not gated artifacts: a CAD kernel's tessellation and
# KiCad's Gerber timestamps are not byte-stable, so hashing them would fail on
# a tool upgrade rather than on drift. The gate covers the text they come from.
"""

[templates."pipelines/thesis.toml"]
source_version = "0.9.0"
hash = "a5d4f4e2f603e00abf72064259499e83927725f1a5b3ad64f6b6762c7d46f81c"
base_content = """
name     = "thesis"
executor = "fid-thesis"
outputs  = [
  "PITCH.md",
  "apps/web/src/generated/thesis.ts",
]

# `thesis.toml` is the declaration. These are what it derives.
#
# `PITCH.md` is the arc assembled in the order you would say it out loud —
# what, for whom, the problem, why now, why us, how, where, then what would
# prove it wrong and where it actually stands. Sections you have not declared
# are left out rather than stubbed, so a partial pitch reads as one you are
# still working out instead of as an unfilled form.
#
# `thesis.ts` is the same claim as a typed constant, so a landing page or a
# metadata export *imports* the sentence instead of retyping it. That is the
# entire point: the wording lives in one file and everything else points at it.
#
# Both outputs wait for what they need. No thesis declared yet → nothing is
# derived and `fid derive --check` does not ask for either, so a product is
# never blocked on having thought of its claim. No app at `apps/web` → the
# TypeScript module is not applicable and `PITCH.md` derives on its own, which
# is what a product with a thesis and no website should get.
#
# `apps/web` is the `fid add app next` convention. A SvelteKit product moves
# that second path; the declaration does not move.
#
# Deliberately NOT derived here: README.md, the i18n catalogs, and the hero
# copy. Those stay hand-written, and `fid advise` checks them against the claim
# instead — flagging drift without rewriting. A generated region inside a
# translated catalog would mean deriving every locale from an English sentence
# through a pipeline that has no translator.
"""

[templates."thesis.toml"]
source_version = "0.9.0"
hash = "83ce126b85f53fb1260d46fc00ec0ebf39643b14bad6df9e33dfbf65a67b6479"
base_content = """
# thesis.toml — what sensor-stick claims, and what would prove it wrong.
#
# Scaffolded by `fid new` (fiducial 0.9.0). Product-owned, and the one
# file here worth filling in before anything else exists.
#
# A thesis is the single claim this product is built to test. Not a description
# of what it does — a claim someone could argue with. If nobody could disagree
# with it, it is a slogan and it will not help you decide anything.
#
# This file is APPEND-ONLY. When the claim sharpens, add a new [[thesis]] that
# supersedes the old one and says why; never edit an entry. How the thinking
# matured is most of what a reader wants, and editing a sentence destroys it.
#
# `claim` is the only required field. One rough line is a valid thesis and
# nothing here blocks a build — `fid derive` produces identical bytes whether
# this is complete or a stub. Fill the rest in as it becomes answerable.
#
#   fid thesis           what is claimed, and what is still unanswered
#   fid thesis log       how the claim got here
#   fid advise           is it falsifiable? could a reasonable person disagree?

# Nothing is declared yet, and that is a valid state: no thesis means no
