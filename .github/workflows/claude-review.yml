name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One review per PR at a time.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Opus review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Review PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD)
          FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)

          REVIEW=$(claude --model claude-opus-5 -p \
            "You are reviewing a pull request for the Fiducial platform.

          Changed files:
          $FILES

          Diff:
          $DIFF

          Check for:
          1. Bugs and correctness issues
          2. Simplifications (unnecessary complexity)
          3. Fiducial rule violations: hand-edited lock-tracked files, duplicated values, hand-written artifacts
          4. Missing tests for new behaviour
          5. Layer violations (logic that belongs in L0 Rust written in TS, or framework logic leaking into headless code)
          6. Capability conformance issues (SKILL.md missing, guard rules malformed)

          Be concise and actionable. Format findings as: **file:line** — severity: summary
          Severity: bug | simplification | rule-violation | test-gap
          If nothing is wrong, say so plainly.")

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "## Opus review

          $REVIEW

          ---
          *Automated review by \`claude-opus-5\`. Run \`/review\` locally for an interactive session.*"
