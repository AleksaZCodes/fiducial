name: Release

# Runs on every merge to main. If there are pending changesets it opens (or
# updates) a "Release PR" that bumps versions and builds the changelog. When
# that PR is merged, the same run detects no pending changesets and publishes
# directly.
#
# Docs: https://github.com/changesets/action

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # for npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changesets needs full history for changelog

      - uses: pnpm/action-setup@v4
        # version read from packageManager field in package.json — do not set here

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action either:
      #   a) opens/updates a "Release PR" when changesets are pending, or
      #   b) publishes when merging a Release PR (no pending changesets).
      - name: Create Release PR or Publish
        id: changesets # referenced by the crates.io step below — without this
        # id, `steps.changesets.outputs.published` is always empty and that step
        # silently never runs.
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # RELEASE_PAT when it exists, GITHUB_TOKEN otherwise.
          #
          # GitHub does not run workflows on a pull request authored by
          # GITHUB_TOKEN without a human pressing approve, so runs on
          # `changeset-release/main` have sat in `action_required` since
          # 2026-09-15. That was harmless until the branch ruleset began
          # requiring status checks, at which point the Release PR became
          # permanently unmergeable and had to be approved by hand every time.
          #
          # A PAT makes the PR authored by a real account, so its CI runs
          # unattended. The fallback means this file is correct before the
          # secret exists and starts working the moment it does — no second
          # change to remember, and no step that fails today for a secret
          # nobody has created yet.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Push the tags changesets created ───────────────────────────────────
      # `changeset publish` prints "Creating git tags… Created git tags." and
      # creates them in the runner's clone. On 2026-09-16 it printed exactly
      # that while `git ls-remote --tags origin` stayed empty afterwards —
      # nothing had ever pushed them. The chain to a Zenodo DOI starts at a
      # tag, so its first link was not merely missing: it appeared to succeed
      # and dropped its output.
      #
      # Runs even when the publish step failed, because a tag for a package
      # that did publish is still owed. `--no-verify` is not used and no tag is
      # forced: an existing remote tag must never be moved.
      - name: Push release tags
        if: always() && steps.changesets.outputs.published == 'true'
        run: git push origin --tags

      # ── Publish Rust crates ────────────────────────────────────────────────
      # No `if:` gate. It used to read
      #
      #   if: steps.changesets.outputs.published == 'true'
      #
      # and on two consecutive runs that *did* publish to npm, this step
      # reported **skipped** — so the fifteen crates were unreachable even
      # before the one-crate loop was considered.
      #
      # The gate is not repaired, it is deleted, because the step does not need
      # one: it asks crates.io what exists and publishes only what does not.
      # The registry is the source of truth about the registry, and a workflow
      # output is a claim about it. That is the same finding as "a publish step
      # exiting 0 is not evidence anything was published", applied one step
      # earlier.
      - name: Publish crates to crates.io
        run: scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # ── Verify, against the registries and the remote ──────────────────────
      # The step that exists because every step above it has lied at least
      # once: `changeset publish` reported "Successfully published" for a
      # package that stayed at its old version, and reported created tags that
      # were never pushed. Exit codes are claims; this asks.
      #
      # Ungated for the same reason the step above it is, and `always()` so it
      # still reports when something upstream failed — what did land is the
      # thing you need to know at that point. Gating this on
      # `steps.changesets.outputs.published` would be checking the claim with
      # the claim.
      - name: Verify what actually reached the registries
        if: always()
        run: scripts/verify-published.sh
