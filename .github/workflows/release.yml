name: Release

# Runs on every merge to main. If there are pending changesets it opens (or
# updates) a "Release PR" that bumps versions and builds the changelog. When
# that PR is merged, the same run detects no pending changesets and publishes
# directly.
#
# Docs: https://github.com/changesets/action

on:
  push:
    branches: [main]
  # Convergence, and the reason the release is no longer merge-triggered only.
  #
  # Every step below re-derives what to do from the registries rather than from
  # the previous run's state, so running again is always safe and never a
  # no-op-by-accident. That makes a periodic run the cheapest possible recovery
  # for anything a push-triggered run missed.
  schedule:
    - cron: "0 */6 * * *"
  # For draining a backlog now rather than in six hours.
  workflow_dispatch:

# One release at a time: `changeset publish` and `cargo publish` must not race
# each other, so runs serialize on a single group.
#
# `cancel-in-progress: false` protects the run that is **executing**. It does
# not protect a run that is **queued** — GitHub keeps at most one pending run
# per group, so a newly queued run evicts the one already waiting, and an
# evicted run never creates a job at all.
#
# On 2026-09-16 that cost a publish. The run for PR #45 (the Release PR merge,
# whose only job was publishing `@fiducial/adapters@0.3.0`) was cancelled one
# second after an unrelated merge queued behind it, while a third run sat in
# `publish-crates.sh`'s hour-long rate-limit sleep holding the group. Zero
# steps ran. The `if: always()` verify step never fired either — `always()`
# covers a *failed* run, not one cancelled before it starts.
#
# Two changes make that survivable, and neither is a wider concurrency group
# (which would just let the publishes race):
#
#   1. `publish-crates.sh` no longer sleeps by default, so the critical
#      section is minutes rather than hours and eviction is rare.
#   2. The `schedule:` above means eviction is no longer **lossy**. A run that
#      is dropped is re-derived by the next one, so the worst case is latency,
#      not a version that main declares and no registry has.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # for npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changesets needs full history for changelog
          # The same token the action uses, so the tags and release it pushes
          # are attributed to a real account and trigger other workflows. A
          # push made with GITHUB_TOKEN does not trigger workflows, which is
          # half of why the Release PR's checks sat in `action_required`.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        # version read from packageManager field in package.json — do not set here

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action either:
      #   a) opens/updates a "Release PR" when changesets are pending, or
      #   b) publishes when merging a Release PR (no pending changesets).
      #
      # **Pinned to v2, and that pin is the root-cause fix.** v1 detects what
      # it published by parsing the CLI's stdout for `New tag:` lines, and
      # `@changesets/cli` 3.x prints a spinner-based "Successfully published:"
      # block instead. In the action's source `pushTags()` and
      # `setOutput("published")` sit inside the **same branch**, so one failed
      # parse produced two symptoms that looked unrelated and were debugged as
      # two bugs on 2026-09-16:
      #
      #   - the crates.io step, gated on `published`, reported skipped on runs
      #     that had just published to npm;
      #   - `Creating git tags… Created git tags.` printed while
      #     `git ls-remote --tags origin` stayed empty.
      #
      # v2.0.0 dropped v1 compatibility and reworked exactly this path. It also
      # renames every input (`publish` → `publish-script`, `title` →
      # `pr-title`, `commit` → `commit-message`) and **no longer reads a token
      # from the GITHUB_TOKEN environment variable** — it must go to the
      # `github-token` input, or the PAT above is silently ignored and the
      # Release PR is bot-authored again.
      #
      # `push-git-tags` and `create-github-releases` both default to true, so
      # this step pushes the tags itself (no separate step needed) and creates
      # the GitHub release — which is the object a Zenodo webhook archives to
      # mint a DOI. Two links of that chain, from one pin.
      - name: Create Release PR or Publish
        id: changesets # referenced by the verify step below
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Publish Rust crates ────────────────────────────────────────────────
      # No `if:` gate. It used to read
      #
      #   if: steps.changesets.outputs.published == 'true'
      #
      # and on two consecutive runs that *did* publish to npm, this step
      # reported **skipped** — so the fifteen crates were unreachable even
      # before the one-crate loop was considered.
      #
      # The gate is not repaired, it is deleted, because the step does not need
      # one: it asks crates.io what exists and publishes only what does not.
      # The registry is the source of truth about the registry, and a workflow
      # output is a claim about it. That is the same finding as "a publish step
      # exiting 0 is not evidence anything was published", applied one step
      # earlier.
      - name: Publish crates to crates.io
        run: scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # ── Verify, against the registries and the remote ──────────────────────
      # The step that exists because every step above it has lied at least
      # once: `changeset publish` reported "Successfully published" for a
      # package that stayed at its old version, and reported created tags that
      # were never pushed. Exit codes are claims; this asks.
      #
      # Ungated for the same reason the step above it is, and `always()` so it
      # still reports when something upstream failed — what did land is the
      # thing you need to know at that point. Gating this on
      # `steps.changesets.outputs.published` would be checking the claim with
      # the claim.
      - name: Verify what actually reached the registries
        if: always()
        run: scripts/verify-published.sh
