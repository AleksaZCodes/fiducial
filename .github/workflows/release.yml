name: Release

# Runs on every merge to main. If there are pending changesets it opens (or
# updates) a "Release PR" that bumps versions and builds the changelog. When
# that PR is merged, the same run detects no pending changesets and publishes
# directly.
#
# Docs: https://github.com/changesets/action

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # for npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changesets needs full history for changelog

      - uses: pnpm/action-setup@v4
        # version read from packageManager field in package.json — do not set here

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action either:
      #   a) opens/updates a "Release PR" when changesets are pending, or
      #   b) publishes when merging a Release PR (no pending changesets).
      - name: Create Release PR or Publish
        id: changesets # referenced by the crates.io step below — without this
        # id, `steps.changesets.outputs.published` is always empty and that step
        # silently never runs.
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Publish Rust crates ────────────────────────────────────────────────
      # Only runs when the Release PR is merged (i.e. when changesets/action
      # actually published — detected by the `published` output being truthy).
      #
      # `cargo publish` errors when the version already exists on crates.io, so
      # each crate is skipped when its current version is already published.
      # Without that guard a JS-only release fails here, because the Rust crate
      # version is unchanged and cannot be pushed twice.
      #
      # crates.io rejects requests without a User-Agent (403), which would make
      # a naive check report "not published" for everything and then fail on the
      # publish itself — so the header is required, not decorative.
      - name: Publish crates to crates.io
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          ua="fiducial-release (https://github.com/${{ github.repository }})"
          for crate in fiducial; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if [ -z "$version" ]; then
              echo "could not resolve a version for $crate" >&2
              exit 1
            fi
            code=$(curl -sS -H "User-Agent: $ua" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$code" in
              200) echo "$crate $version already on crates.io — skipping" ;;
              404) echo "publishing $crate $version"; cargo publish --package "$crate" ;;
              *)   echo "crates.io returned $code checking $crate $version" >&2; exit 1 ;;
            esac
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
