name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── L0 spine: 4-target matrix ─────────────────────────────────────────────
  #
  # fiducial-core is #![no_std] and must compile for every target, every commit.
  # A failure here is treated as a P0 regression, not a future concern.
  # Design spec §4: "CI compiles the spine for x86_64, wasm32-unknown-unknown,
  # thumbv6m-none-eabi and thumbv7em-none-eabihf every commit."
  spine:
    name: spine (${{ matrix.target.triple }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            features: "--features std"
            check_wasm: false
          - triple: wasm32-unknown-unknown
            features: "--no-default-features"
            check_wasm: true
          - triple: thumbv6m-none-eabi
            features: "--no-default-features"
            check_wasm: false
          - triple: thumbv7em-none-eabihf
            features: "--no-default-features"
            check_wasm: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check fiducial-core (${{ matrix.target.triple }})
        run: >
          cargo check
          --package fiducial-core
          --target ${{ matrix.target.triple }}
          ${{ matrix.target.features }}

      - name: Check fiducial-wasm (${{ matrix.target.triple }})
        if: matrix.target.check_wasm
        run: >
          cargo check
          --package fiducial-wasm
          --target ${{ matrix.target.triple }}

      - name: Check fiducial-quantity (${{ matrix.target.triple }})
        run: >
          cargo check
          --package fiducial-quantity
          --target ${{ matrix.target.triple }}
          ${{ matrix.target.features }}

      - name: Check fiducial-model (${{ matrix.target.triple }})
        run: >
          cargo check
          --package fiducial-model
          --target ${{ matrix.target.triple }}
          ${{ matrix.target.features }}

      - name: Check fiducial-protocol (${{ matrix.target.triple }})
        run: >
          cargo check
          --package fiducial-protocol
          --target ${{ matrix.target.triple }}
          ${{ matrix.target.features }}

      - name: Check fiducial-eda (${{ matrix.target.triple }})
        run: >
          cargo check
          --package fiducial-eda
          --target ${{ matrix.target.triple }}
          ${{ matrix.target.features }}

      - name: Check fiducial-geometry (${{ matrix.target.triple }})
        run: >
          cargo check
          --package fiducial-geometry
          --target ${{ matrix.target.triple }}
          ${{ matrix.target.features }}

      - name: Check fiducial-mesh (${{ matrix.target.triple }})
        run: >
          cargo check
          --package fiducial-mesh
          --target ${{ matrix.target.triple }}
          ${{ matrix.target.features }}

      - name: Check fiducial-ota (${{ matrix.target.triple }})
        run: >
          cargo check
          --package fiducial-ota
          --target ${{ matrix.target.triple }}
          ${{ matrix.target.features }}

      - name: Check fiducial-sim (${{ matrix.target.triple }})
        run: >
          cargo check
          --package fiducial-sim
          --target ${{ matrix.target.triple }}
          --no-default-features

  # ── Host: full workspace build + tests ────────────────────────────────────
  rust:
    name: Rust (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (libudev for serialport)
        run: sudo apt-get update -q && sudo apt-get install -y pkg-config libudev-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (workspace)
        run: cargo test --workspace

  # ── WASM: wasm-pack build ─────────────────────────────────────────────────
  wasm-pack:
    name: wasm-pack (fiducial-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: wasm-pack build (bundler)
        run: wasm-pack build crates/fiducial-wasm --target bundler

      - name: wasm-pack test (node)
        run: wasm-pack test --node crates/fiducial-wasm

  # ── Firmware: RP2040 check ────────────────────────────────────────────────
  firmware:
    name: firmware (RP2040 + STM32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + embedded targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi,thumbv7em-none-eabihf

      - name: Install libudev (required by serialport / probe-rs build deps)
        run: sudo apt-get install -y libudev-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware -> firmware/target

      - name: Check firmware workspace (RP2040 — thumbv6m-none-eabi)
        working-directory: firmware
        run: cargo check --target thumbv6m-none-eabi -p fiducial-firmware-shared -p fiducial-rp2040

      - name: Check firmware workspace (STM32 — thumbv7em-none-eabihf)
        working-directory: firmware
        run: cargo check --target thumbv7em-none-eabihf -p fiducial-firmware-shared -p fiducial-stm32

  # ── Types pipeline: generate TS types from Rust, verify freshness ──────────
  #
  # "A stale artifact fails CI" — Phase 9. Runs cargo test --features ts to
  # regenerate packages/wasm-bridge/src/generated.ts, then checks for drift.
  types-pipeline:
    name: types pipeline (--check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Regenerate TS types
        run: cargo test --features ts -p fiducial-wasm

      - name: Check for drift
        run: git diff --exit-code packages/wasm-bridge/src/generated.ts

  # ── EDA pipeline: validate board.interface.json schema ───────────────────
  #
  # "A board change regenerates every output; --check catches staleness" — Phase 14.
  # Runs cargo test -p fiducial-eda to validate the seed board.interface.json
  # against the BoardInterface schema. No atopile/KiCad needed in CI.
  eda-pipeline:
    name: EDA pipeline (schema check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate board.interface.json schema
        run: cargo test --features std -p fiducial-eda

  # ── Mesh generation: geometry + mesh crate tests ─────────────────────────
  #
  # "Board outline → printable STL and a GLB" — Phase 15.
  # Runs unit tests that verify extrusion, STL header, and GLB magic bytes.
  mesh-gen:
    name: mesh generation (STL + GLB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test fiducial-geometry
        run: cargo test -p fiducial-geometry

      - name: Test fiducial-mesh (std feature)
        run: cargo test --features std -p fiducial-mesh

      # End-to-end: fid new -> fid add eda -> fid derive -> validate STL/GLB.
      # Covers the executor, the pipeline wiring, and --check staleness.
      - name: Enclosure pipeline (end-to-end)
        run: cargo test -p fiducial-cli --test enclosure_pipeline

  # ── Workbench: fid dash renders and stays a read-only view ────────────────
  #
  # Phase 16. The tests drive the real binary through new → add → derive → dash
  # and assert against its JSON, including that dash writes nothing.
  workbench:
    name: workbench (fid dash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `--bins`, not `--lib`: fiducial-cli is a binary-only crate, so its unit
      # tests compile into the `fid` test target.
      - name: Pipeline discovery is read in one place
        run: cargo test -p fiducial-cli --bins pipeline

      - name: fid dash end-to-end
        run: cargo test -p fiducial-cli --test dash

      - name: Help text names no phase and claims nothing false
        run: cargo test -p fiducial-cli --test help_honesty

  # ── Release: wire-version matrix in sync with compiled constant ───────────
  #
  # Phase 16b. The test suite drives `fid release` through its subcommands and
  # verifies that a protocol bump correctly fails an old-version artifact.
  # `check_passes_with_committed_matrix` is the hard gate: it fails when someone
  # bumps WIRE_VERSION without updating docs/compat/matrix.toml (or vice-versa).
  release:
    name: release (fid release check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Protocol unit tests (version-skew assertions)
        run: cargo test -p fiducial-protocol

      - name: Release integration tests
        run: cargo test -p fiducial-cli --test release

      - name: fid release check (matrix ↔ WIRE_VERSION in sync)
        run: |
          cargo build -p fiducial-cli --bin fid
          ./target/debug/fid release check

      # The cross-implementation anchor. Runs WITHOUT FIDUCIAL_WRITE_VECTORS,
      # so a wire change that did not regenerate the committed vectors fails
      # here rather than in the field.
      - name: Conformance vectors are fresh
        run: cargo test -p fiducial-protocol --test vectors

  # ── OTA: the first sub-protocol on the waist (Phase 16c) ──────────────────
  #
  # Every failure mode in design spec §12.3 is a test. They run on the host
  # with no hardware because the update path is pure logic -- "never brick"
  # and "signed, always" are assertions here, not hopes.
  ota:
    name: ota (fiducial-ota)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi,thumbv7em-none-eabihf,wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Transfer state machine (§12.3 failure modes)
        run: cargo test -p fiducial-ota

      - name: Real ed25519 signing and verification
        run: cargo test -p fiducial-ota --features ed25519

      # The OTA state machine must build on every device target, with and
      # without software crypto -- a device with a hardware PKA implements
      # SignatureVerifier against that instead.
      - name: no_std on every device target
        run: |
          for t in thumbv6m-none-eabi thumbv7em-none-eabihf wasm32-unknown-unknown; do
            cargo check -p fiducial-ota --target "$t"
            cargo check -p fiducial-ota --target "$t" --features ed25519
          done

  # ── JavaScript / TypeScript ───────────────────────────────────────────────
  js:
    name: JS/TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version read from packageManager field in package.json — do not set here

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # ── fiducial-sim: numerical simulation, native + WASM check ──────────────
  #
  # Phase 17. `rayon` is disabled on WASM targets (single-threaded default).
  # The spine matrix already checks that the crate compiles for every target;
  # this job runs the full test suite plus the WASM no-default-features build.
  sim:
    name: sim (fiducial-sim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test fiducial-sim (native, with rayon)
        run: cargo test -p fiducial-sim

      - name: Check fiducial-sim (WASM, no rayon)
        run: cargo check -p fiducial-sim --target wasm32-unknown-unknown --no-default-features

  # ── realtime: three contracts ─────────────────────────────────────────────
  #
  # Phase 17. Broadcast, Presence, and Postgres Changes are each covered by
  # tests. No live Supabase connection — mock adapters only.
  realtime:
    name: realtime (@fiducial/realtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test @fiducial/realtime
        run: pnpm --filter @fiducial/realtime test

  # ── portfolio: workbench v1 ───────────────────────────────────────────────
  #
  # Phase 17. `fid dash --portfolio` aggregates multiple product repos from a
  # portfolio manifest. The test scaffolds two products, writes the manifest,
  # and asserts the aggregated JSON is correct.
  portfolio:
    name: portfolio (workbench v1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fid dash --portfolio end-to-end
        run: cargo test -p fiducial-cli --test portfolio
